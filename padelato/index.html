/* Round-by-round score list — used on the results screen and in replays.
   Read-only; shows only rounds that were actually scored. */
function roundByRoundHTML(t) {
  const nm = pid => esc(Engine.playerName(t, pid));
  const playedRounds = t.rounds.filter(r => Engine.anyScores(r));
  if (playedRounds.length === 0) return '';
  return `
    <div class="field-label" style="margin-top:18px">Round by round</div>
    <div class="replay-rounds">
      ${playedRounds.map(r => {
        const ri = t.rounds.indexOf(r);
        return `
        <div class="replay-round">
          <div class="rr-head">Round ${ri + 1}</div>
          ${r.matches.map(m => {
            const scored = m.scoreA !== null && m.scoreB !== null;
            const aWin = scored && m.scoreA > m.scoreB, bWin = scored && m.scoreB > m.scoreA;
            return `
            <div class="rr-match">
              <span class="rr-team ${aWin ? 'w' : ''}">${nm(m.teamA[0])} &amp; ${nm(m.teamA[1])}</span>
              <span class="rr-score">${scored ? `${m.scoreA}<span class="d">–</span>${m.scoreB}` : '<span class="d">—</span>'}</span>
              <span class="rr-team right ${bWin ? 'w' : ''}">${nm(m.teamB[0])} &amp; ${nm(m.teamB[1])}</span>
            </div>`;
          }).join('')}
          ${r.resting && r.resting.length ? `<div class="rr-rest">Sitting out: ${r.resting.map(nm).join(', ')}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
}

/* ---------------- mixed-groups standings filter (All · group A · group B) ----------------
   One shared filter state reused by every standings surface (live tab, results,
   replays, shared links) — each surface re-renders itself when it changes. */
let groupFilter = 'all';   // 'all' | 'A' | 'B' — only consulted when config.mixedGroups

function groupFilterHTML(cfg) {
  if (!cfg.mixedGroups) return '';
  const gn = cfg.groupNames || ['Group A', 'Group B'];
  return `<div class="seg seg-groupfilter">
    <button data-gfil="all" class="${groupFilter === 'all' ? 'on' : ''}">All</button>
    <button data-gfil="A" class="${groupFilter === 'A' ? 'on' : ''}">${esc(gn[0])}</button>
    <button data-gfil="B" class="${groupFilter === 'B' ? 'on' : ''}">${esc(gn[1])}</button>
  </div>`;
}
/** rows for the current filter, re-ranked 1..N within the group */
function filterStandings(st, t) {
  if (!t.config.mixedGroups || groupFilter === 'all') return st;
  const g = {};
  t.players.forEach(p => { g[p.id] = p.group; });
  return st.filter(s => g[s.player.id] === groupFilter);
}
function wireGroupFilter(root, rerender) {
  root.querySelectorAll('[data-gfil]').forEach(b => b.addEventListener('click', () => {
    groupFilter = b.dataset.gfil;
    rerender();
  }));
}

/* Read-only final-standings table — shared by the replay sheet and the shareable
   read-only viewer (#r=… links). Reads a snapshot/tournament object. */
function standingsTableHTML(snap) {
  const st = filterStandings(Engine.standings(snap), snap);
  const maxPts = Math.max(1, ...st.map(s => s.points));
  const hasRests = snap.rounds.some(r => r.resting && r.resting.length);
  return `
    <table class="stand-table">
      <thead><tr><th></th><th>${snap.config.fixedPairs ? 'Team' : 'Player'}</th><th>${scoreUnitCap(snap.config)}</th><th>±</th><th>W·D·L</th>${hasRests ? '<th>Rest</th>' : ''}</tr></thead>
      <tbody>
        ${st.map((s, i) => `
          <tr class="top${i + 1}">
            <td class="rank">${i + 1}</td>
            <td class="pname">${esc(s.player.name)}${s.player.active ? '' : ' <span class="out">(left)</span>'}
              <div class="ptbar"><i style="width:${Math.round(100 * s.points / maxPts)}%"></i></div>
            </td>
            <td class="pts">${Math.round(s.points)}</td>
            <td style="color:${s.diff > 0 ? 'var(--lime)' : s.diff < 0 ? 'var(--red)' : 'var(--txt-faint)'}">${s.diff > 0 ? '+' : ''}${s.diff}</td>
            <td style="color:var(--txt-dim)">${s.wins}·${s.draws}·${s.losses}</td>
            ${hasRests ? `<td style="color:var(--txt-faint)">${s.rests}</td>` : ''}
          </tr>`).join('')}
      </tbody>
    </table>`;
}

/* ---------------- score views (bump chart · highlights · head-to-head) ---------------- */
/* Static, read-only analytics rendered from a finished tournament object — used
   on the results screen (live T) and inside replays (a stored snapshot). */

const VIEW_COLORS = ['#cdf545', '#5fd4f5', '#f5b945', '#f56960', '#b794f6', '#4fd1a5', '#f78fb3', '#7aa5ff', '#e0c068', '#9aa7b3', '#7fd1c0', '#d98fe0'];

function scoreViewsHTML(t) {
  // mixed group view: the whole story (chart, highlights, h2h) narrows to the group,
  // with ranks re-derived WITHIN the group per round — not overall ranks filtered.
  const members = (t.config.mixedGroups && groupFilter !== 'all')
    ? new Set(t.players.filter(p => p.group === groupFilter).map(p => p.id))
    : null;
  let st = Engine.standings(t);
  if (members) st = st.filter(s => members.has(s.player.id));
  let prog = Engine.progression(t);
  if (members) {
    prog = prog.map(step => {
      const order = step.order.filter(id => members.has(id));
      const rank = {}, points = {};
      order.forEach((id, i) => { rank[id] = i; points[id] = step.points[id]; });
      return { round: step.round, order, rank, points };
    });
  }
  if (prog.length === 0) return ''; // nothing scored — no story to tell yet
  const h2h = Engine.headToHead(t);
  const blocks = bumpChartHTML(t, st, prog) + statHighlightsHTML(t, st, prog) + h2hMatrixHTML(t, st, h2h);
  return blocks ? `<div class="score-views">${blocks}</div>` : '';
}

function bumpChartHTML(t, st, prog) {
  const players = st.filter(s => s.played > 0);
  if (prog.length < 2 || players.length < 2) return ''; // need movement to show
  const total = st.length;
  const colorOf = {};
  st.forEach((s, i) => { colorOf[s.player.id] = VIEW_COLORS[i % VIEW_COLORS.length]; });

  const W = 340, mL = 12, mR = 96, mT = 10, mB = 22;
  const rowGap = Math.min(26, Math.max(15, Math.floor(150 / Math.max(1, total - 1))));
  const H = mT + (total - 1) * rowGap + mB;
  const plotW = W - mL - mR;
  const xOf = i => mL + (prog.length === 1 ? 0 : (i / (prog.length - 1)) * plotW);
  const yOf = rank => mT + rank * rowGap;

  const lines = players.map(s => {
    const pid = s.player.id, col = colorOf[pid];
    const pts = prog.map((step, i) => `${xOf(i).toFixed(1)},${yOf(step.rank[pid]).toFixed(1)}`).join(' ');
    const dots = prog.map((step, i) => `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(step.rank[pid]).toFixed(1)}" r="2.6" fill="${col}"/>`).join('');
    const finalRank = prog[prog.length - 1].rank[pid];
    const label = `<text x="${mL + plotW + 6}" y="${(yOf(finalRank) + 3.5).toFixed(1)}" fill="${col}" font-size="11" font-weight="700">${esc(s.player.name).slice(0, 12)}</text>`;
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>${dots}${label}`;
  }).join('');
  const xlabels = prog.map((step, i) => `<text x="${xOf(i).toFixed(1)}" y="${H - 6}" fill="#5d6b77" font-size="9" text-anchor="middle">${step.round}</text>`).join('');

  return `
    <div class="sv-block">
      <div class="sv-title">Rank timeline</div>
      <div class="sv-sub">Who moved up or down each round — 1st sits at the top.</div>
      <svg class="bump-svg" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Rank over the rounds">${lines}${xlabels}</svg>
    </div>`;
}

function statHighlightsHTML(t, st, prog) {
  const fixed = !!t.config.fixedPairs;
  const nm = pid => esc(Engine.playerName(t, pid));
  // resolve a competitor id (player id, or team id in fixed-pairs mode) to its display name
  const compName = id => { const r = st.find(s => s.player.id === id); return esc(r ? r.player.name : Engine.playerName(t, id)); };
  // the player ids a competitor occupies in a match row (a team's two players, or itself)
  const memberPids = id => fixed ? ((t.teams || []).find(tm => tm.id === id) || { players: [] }).players : [id];
  const card = (ico, label, big, sub) =>
    `<div class="stat-card"><div class="sc-ico">${ico}</div><div class="sc-label">${label}</div><div class="sc-big">${big}</div><div class="sc-sub">${sub}</div></div>`;
  const cards = [];
  let climberId = null; // remembered so the Late bloomer card never re-prints the climber

  // biggest climber (first scored round → final); else wire-to-wire leader
  if (prog.length >= 2) {
    const first = prog[0].rank, lastStep = prog[prog.length - 1];
    let best = null;
    for (const s of st) {
      if (s.played <= 0) continue;
      const d = (first[s.player.id] ?? 0) - lastStep.rank[s.player.id]; // + = climbed up the table
      if (d > 0 && (!best || d > best.d)) best = { id: s.player.id, d };
    }
    if (best) { climberId = best.id; cards.push(card('🚀', 'Biggest climber', compName(best.id), `up ${best.d} place${best.d > 1 ? 's' : ''} since round ${prog[0].round}`)); }
    else {
      const winner = lastStep.order[0];
      if (prog.every(s => s.order[0] === winner)) cards.push(card('🏁', 'Wire to wire', compName(winner), `top of the table from round ${prog[0].round} on`));
    }
  }

  // best single round = highest individual match score
  let br = null;
  t.rounds.forEach((r, ri) => {
    for (const m of r.matches) {
      if (m.scoreA === null || m.scoreB === null) continue;
      const hi = Math.max(m.scoreA, m.scoreB);
      if (!br || hi > br.score) br = { score: hi, team: m.scoreA >= m.scoreB ? m.teamA : m.teamB, round: ri + 1 };
    }
  });
  if (br) cards.push(card('🔥', 'Best round', `${nm(br.team[0])} &amp; ${nm(br.team[1])}`, `${br.score} ${scoreUnit(t.config)} in round ${br.round}`));

  // closest finish = smallest gap between adjacent finishers who played
  const played = st.filter(s => s.played > 0);
  if (played.length >= 2) {
    let cf = null;
    for (let i = 1; i < played.length; i++) {
      const gap = Math.round(played[i - 1].points) - Math.round(played[i].points);
      if (cf === null || gap < cf.gap) cf = { gap, a: played[i - 1].player.id, b: played[i].player.id };
    }
    if (cf) cards.push(card('⚔️', 'Closest finish', `${compName(cf.a)} vs ${compName(cf.b)}`, cf.gap === 0 ? `dead level on ${scoreUnit(t.config)}` : `just ${cf.gap} ${t.config.scoring === 'games' ? 'game' : 'pt'}${cf.gap > 1 ? 's' : ''} apart`));
  }

  // late bloomer = biggest rank climb over the final stretch. Distinct from the
  // whole-tournament climber above: it reads only the *end* of the table, where
  // ranks have settled (so it isn't round-1 noise) and where a player near the
  // bottom has the most room to climb — surfacing a late surge / great escape
  // rather than a podium echo. Deduped against the climber so they never collide.
  if (prog.length >= 4) {
    const W = prog.length >= 5 ? 3 : 2;            // final stretch = last 3 rounds (2 if short)
    const startStep = prog[prog.length - 1 - W], endStep = prog[prog.length - 1];
    const ordinal = n => { const v = n % 100, s = ['th', 'st', 'nd', 'rd']; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
    const climbers = [];
    for (const s of st) {
      if (s.played <= 0) continue;
      const pid = s.player.id, sr = startStep.rank[pid], er = endStep.rank[pid];
      if (sr == null || er == null) continue;
      const gain = sr - er;                        // + = climbed up the table over the window
      if (gain >= 2) climbers.push({ id: pid, gain, from: sr + 1, to: er + 1 });
    }
    climbers.sort((a, b) => b.gain - a.gain);
    const lb = climbers.find(c => c.id !== climberId);
    if (lb) {
      // did the surge come from winning out? count their results in the window rounds
      let lbWon = 0, lbPlayed = 0;
      const lbPids = memberPids(lb.id);
      for (const step of prog.slice(prog.length - W)) {
        for (const m of t.rounds[step.round - 1].matches) {
          if (m.scoreA === null || m.scoreB === null) continue;
          const inA = lbPids.some(pid => m.teamA.includes(pid)), inB = lbPids.some(pid => m.teamB.includes(pid));
          if (!inA && !inB) continue;
          lbPlayed++;
          if ((inA ? m.scoreA : m.scoreB) > (inA ? m.scoreB : m.scoreA)) lbWon++;
          break;
        }
      }
      const sub = (lbPlayed > 0 && lbWon === lbPlayed)
        ? `won the last ${lbWon} to climb from ${ordinal(lb.from)} to ${ordinal(lb.to)}`
        : `up ${lb.gain} place${lb.gain > 1 ? 's' : ''} in the final ${W} rounds`;
      cards.push(card('🌱', 'Late bloomer', compName(lb.id), sub));
    }
  }

  if (!cards.length) return '';
  return `<div class="sv-block"><div class="sv-title">Highlights</div><div class="stat-cards">${cards.join('')}</div></div>`;
}

function h2hMatrixHTML(t, st, h2h) {
  const players = st.filter(s => s.played > 0);
  if (players.length < 2) return '';
  let anyFaced = false;
  for (const a of players) { for (const b of players) { if (a.player.id !== b.player.id && h2h[a.player.id][b.player.id]) { anyFaced = true; break; } } if (anyFaced) break; }
  if (!anyFaced) return '';

  const head = players.map((s, j) => `<th class="h2h-col">${j + 1}</th>`).join('');
  const rows = players.map((s, i) => {
    const cells = players.map((o, j) => {
      if (i === j) return '<td class="h2h-diag">·</td>';
      const rec = h2h[s.player.id][o.player.id];
      if (!rec || !rec.faced) return '<td class="h2h-na">–</td>';
      const cls = rec.net > 0 ? 'pos' : rec.net < 0 ? 'neg' : 'evn';
      return `<td class="h2h-cell ${cls}" title="${esc(s.player.name)} vs ${esc(o.player.name)}: ${rec.wins}W ${rec.draws}D ${rec.losses}L">${rec.net > 0 ? '+' : ''}${rec.net}</td>`;
    }).join('');
    return `<tr><th class="h2h-row">${i + 1}. ${esc(s.player.name).slice(0, 10)}</th>${cells}</tr>`;
  }).join('');

  return `
    <div class="sv-block">
      <div class="sv-title">Head to head</div>
      <div class="sv-sub">Net points when two ${t.config.fixedPairs ? 'teams faced each other' : 'players were on opposing teams'} — <span style="color:var(--lime)">green ahead</span>, <span style="color:var(--red)">red behind</span>. Columns are the numbered ${t.config.fixedPairs ? 'teams' : 'players'}.</div>
      <div class="h2h-scroll">
        <table class="h2h-matrix">
          <thead><tr><th class="h2h-corner"></th>${head}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function copyStandings() {
  const st = Engine.standings(T);
  const medals = ['🥇', '🥈', '🥉'];
  const lines = [
    `🎾 ${T.config.name} — ${new Date(T.createdAt || Date.now()).toLocaleDateString()}`,
    `${formatLabel(T.config)} · ${T.rounds.length} rounds · ${matchGoalText(T.config)}`,
    '',
    ...st.map((s, i) => `${medals[i] || (i + 1) + '.'} ${s.player.name} — ${Math.round(s.points)} ${scoreUnit(T.config)} (${s.wins}W ${s.draws}D ${s.losses}L, ${s.diff > 0 ? '+' : ''}${s.diff})`),
  ];
  copyText(lines.join('\n'), 'Standings copied');
}

function copyText(text, okMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    toast('Copying…');
    navigator.clipboard.writeText(text).then(() => toast(okMsg), () => toast('Copy failed', true));
  } else toast('Clipboard unavailable', true);
}

function copyRoundDraws() {
  const r = T.rounds[viewRound];
  const prov = T.config.format === 'americano' && viewRound > currentRoundIdx(T) && !Engine.anyScores(r);
  const lines = [
    `🎾 ${T.config.name} — Round ${viewRound + 1}${prov ? ' (provisional)' : ''}`,
    ...r.matches.map((m, i) =>
      `Court ${i + 1}: ${Engine.playerName(T, m.teamA[0])} + ${Engine.playerName(T, m.teamA[1])} vs ${Engine.playerName(T, m.teamB[0])} + ${Engine.playerName(T, m.teamB[1])}` +
      (m.scoreA !== null ? `  (${m.scoreA}–${m.scoreB})` : '')),
  ];
  if (r.resting.length) lines.push('Sitting out: ' + r.resting.map(pid => Engine.playerName(T, pid)).join(', '));
  copyText(lines.join('\n'), 'Round draws copied');
}

/* ---------------- shareable read-only results link ---------------- */
/* A finished tournament is frozen into the URL hash (#r=…) and opened in a
   read-only viewer (renderSharedView) — no backend, no network: the whole result
   is base64url-encoded into the link itself. Only the fields the read-only
   renderers read are kept, and only scored rounds, to keep the link short. */

function slimSnapshot(t) {
  return {
    v: 1,
    createdAt: t.createdAt || null,
    config: t.config,
    players: t.players.map(p => ({ id: p.id, name: p.name, active: p.active, arrived: p.arrived, group: p.group })),
    teams: t.teams ? t.teams.map(tm => ({ id: tm.id, players: tm.players.slice() })) : undefined,
    rounds: t.rounds.filter(r => Engine.anyScores(r)).map(r => ({
      matches: r.matches.map(m => ({ teamA: m.teamA, teamB: m.teamB, scoreA: m.scoreA, scoreB: m.scoreB })),
      resting: r.resting || [],
    })),
  };
}

// base64url over UTF-8 bytes — survives accented names and is URL-safe (no +,/,=).
function b64urlEncode(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const bin = atob(str), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
/* Compact wire format (v2): a positional array with players referenced by index
   instead of repeating 8-char ids and JSON keys in every match — ~4-5× shorter
   links. expandCompact() rebuilds the full snapshot shape the renderers expect.
   Legacy v1 (a plain object with .config) is still accepted on decode. */
function compactSnapshot(t) {
  const slim = slimSnapshot(t);
  const idx = {}; slim.players.forEach((p, i) => { idx[p.id] = i; });
  const c = slim.config;
  const cfg = { n: c.name, f: c.format, s: c.scoring, k: c.ranking, r: c.restMode, p: c.pointsPerMatch, g: c.gamesTarget };
  if (c.fixedPairs) cfg.x = 1;
  if (c.mixedGroups) { cfg.m = 1; cfg.gn = c.groupNames; }
  const names = slim.players.map(p => p.name);
  const inactive = [], pending = [];
  slim.players.forEach((p, i) => { if (p.active === false) inactive.push(i); if (p.arrived === false) pending.push(i); });
  const rounds = slim.rounds.map(r => [
    r.matches.map(m => [idx[m.teamA[0]], idx[m.teamA[1]], idx[m.teamB[0]], idx[m.teamB[1]], m.scoreA, m.scoreB]),
    (r.resting || []).map(pid => idx[pid]),
  ]);
  // fixed pairs: teams as [idxA, idxB] pairs so the shared view can rebuild team standings
  const teams = (slim.teams || []).map(tm => tm.players.map(pid => idx[pid]));
  // mixed groups: indices of the B-side players (everyone else is A)
  const groupsB = [];
  if (c.mixedGroups) slim.players.forEach((p, i) => { if (p.group === 'B') groupsB.push(i); });
  return [2, slim.createdAt || 0, cfg, names, rounds, inactive, pending, teams, groupsB];
}
function expandCompact(a) {
  if (!Array.isArray(a) || a[0] !== 2) throw new Error('unsupported version');
  const [, createdAt, cfg, names, rounds, inactive = [], pending = [], teams = [], groupsB = []] = a;
  const config = { name: cfg.n, format: cfg.f, scoring: cfg.s, ranking: cfg.k, restMode: cfg.r, pointsPerMatch: cfg.p, gamesTarget: cfg.g };
  if (cfg.x) config.fixedPairs = true;
  if (cfg.m) { config.mixedGroups = true; config.groupNames = Array.isArray(cfg.gn) ? cfg.gn : ['Group A', 'Group B']; }
  const players = names.map((name, i) => ({ id: String(i), name, active: !inactive.includes(i), arrived: !pending.includes(i) }));
  if (cfg.m) players.forEach((p, i) => { p.group = groupsB.includes(i) ? 'B' : 'A'; });
  const snap = {
    v: 1, createdAt: createdAt || null, config, players,
    rounds: rounds.map(([ms, rest]) => ({
      matches: ms.map(m => ({ teamA: [String(m[0]), String(m[1])], teamB: [String(m[2]), String(m[3])], scoreA: m[4], scoreB: m[5] })),
      resting: (rest || []).map(String),
    })),
  };
  if (cfg.x) snap.teams = teams.map((pr, i) => ({ id: 'tm' + i, players: [String(pr[0]), String(pr[1])] }));
  return snap;
}
function encodeShare(t) { return b64urlEncode(new TextEncoder().encode(JSON.stringify(compactSnapshot(t)))); }
function decodeShare(str) {
  const data = JSON.parse(new TextDecoder().decode(b64urlDecode(str)));
  const snap = Array.isArray(data) ? expandCompact(data) : data; // v2 compact array | legacy v1 object
  if (!snap || !snap.config || !Array.isArray(snap.players) || !Array.isArray(snap.rounds)) throw new Error('bad snapshot');
  return snap;
}
function shareURL(t) { return location.origin + location.pathname + '#r=' + encodeShare(t); }

/* Share the frozen results by copying the link to the clipboard on every
   platform (predictable "link copied", no OS share sheet). Falls back to a
   selectable link sheet only where the clipboard API is unavailable. */
function shareResultsLink(t) {
  const url = shareURL(t);
  if (navigator.clipboard && navigator.clipboard.writeText) { copyText(url, 'Results link copied'); return; }
  showShareLinkSheet(url);
}

function showShareLinkSheet(url) {
  const ov = sheet(`
    <div class="grab"></div>
    <h3>Share results link</h3>
    <div class="sub">Copy this link into your group — anyone who opens it sees the final standings, read-only.</div>
    <input id="share-link" readonly value="${esc(url)}"
      style="width:100%;box-sizing:border-box;margin-top:14px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg1);color:var(--txt);font-size:.82rem;font-family:inherit" />
    <button class="btn btn-primary btn-block" id="share-copy" style="margin-top:12px">Copy link</button>`);
  const inp = ov.querySelector('#share-link');
  inp.addEventListener('focus', () => inp.select());
  ov.querySelector('#share-copy').addEventListener('click', () => {
    inp.select();
    if (navigator.clipboard && navigator.clipboard.writeText) copyText(url, 'Results link copied');
    else { try { document.execCommand('copy'); toast('Results link copied'); } catch (e) { toast('Select and copy the link', true); } }
  });
}

/* ---------------- finish / results ---------------- */

function finishTournament() {
  mutate(() => {
    T.finished = true;
    store.archive(T);
    const act = Engine.activePlayers(T);
    store.saveLastPlayers(
      act.map(p => p.name),
      Object.fromEntries(act.map(p => [p.name.toLowerCase(), p.skill || 2])),
      T.config.useSkills);
  });
}

function renderResults() {
  const st = Engine.standings(T);
  const rows = filterStandings(st, T);
  const [p1, p2, p3] = rows;          // podium follows the group filter (top 3 of the view)
  const hasRests = T.rounds.some(r => r.resting && r.resting.length);
  const colors = ['#cdf545', '#5fd4f5', '#f5b945', '#f56960', '#e8edf2'];
  const confetti = Array.from({ length: 40 }, (_, i) =>
    `<div class="confetti" style="left:${Math.random() * 100}%;background:${colors[i % colors.length]};animation-delay:${(Math.random() * 1.2).toFixed(2)}s;transform:rotate(${Math.random() * 360}deg)"></div>`).join('');

  app.innerHTML = `
  <div class="screen">
    <div class="content" style="padding-top:30px">
      <div class="results-inner">
      ${groupFilterHTML(T.config)}
      <div class="podium-wrap">
        ${confetti}
        <h2>Final standings</h2>
        <div class="sub">${esc(T.config.name)} · ${T.rounds.length} rounds · ${new Date(T.createdAt || Date.now()).toLocaleDateString()}</div>
        <div class="podium">
          ${p2 ? `<div class="pod p2"><div class="pname">${esc(p2.player.name)}</div><div class="ppts">${Math.round(p2.points)} ${scoreUnit(T.config)}</div><div class="block">2</div></div>` : ''}
          ${p1 ? `<div class="pod p1"><div class="pname">${esc(p1.player.name)}</div><div class="ppts">${Math.round(p1.points)} ${scoreUnit(T.config)}</div><div class="block">1</div></div>` : ''}
          ${p3 ? `<div class="pod p3"><div class="pname">${esc(p3.player.name)}</div><div class="ppts">${Math.round(p3.points)} ${scoreUnit(T.config)}</div><div class="block">3</div></div>` : ''}
        </div>
      </div>
      <table class="stand-table">
        <thead><tr><th></th><th>${T.config.fixedPairs ? 'Team' : 'Player'}</th><th>${scoreUnitCap(T.config)}</th><th>±</th><th>W·D·L</th>${hasRests ? '<th>Rest</th>' : ''}</tr></thead>
        <tbody>
          ${rows.map((s, i) => `
            <tr class="top${i + 1}">
              <td class="rank">${i + 1}</td>
              <td class="pname">${esc(s.player.name)}</td>
              <td class="pts">${Math.round(s.points)}</td>
              <td style="color:${s.diff > 0 ? 'var(--lime)' : s.diff < 0 ? 'var(--red)' : 'var(--txt-faint)'}">${s.diff > 0 ? '+' : ''}${s.diff}</td>
              <td style="color:var(--txt-dim)">${s.wins}·${s.draws}·${s.losses}</td>
              ${hasRests ? `<td style="color:var(--txt-faint)">${s.rests}</td>` : ''}
            </tr>`).join('')}
        </tbody>
      </table>
      ${scoreViewsHTML(T)}
      ${roundByRoundHTML(T)}
      <div class="round-actions" style="margin-top:24px">
        <button class="btn btn-primary btn-block" id="res-sharelink">🔗 Share results link</button>
        <button class="btn btn-ghost btn-block" id="res-share">📋 Copy results text</button>
        <button class="btn btn-ghost btn-block" id="res-new">Start a new tournament</button>
        <button class="btn btn-ghost btn-block" id="res-back">← Back to rounds (reopen)</button>
      </div>
      </div>
      ${footerHTML()}
    </div>
  </div>`;
  $('#res-sharelink').addEventListener('click', () => shareResultsLink(T));
  $('#res-share').addEventListener('click', copyStandings);
  wireGroupFilter(app, renderResults);
  $('#res-new').addEventListener('click', () => {
    store.clearCurrent(); T = null; setupState = defaultSetup(); render();
  });
  $('#res-back').addEventListener('click', () => mutate(() => { T.finished = false; }));
}

/* ---------------- shared read-only viewer (#r=… link target) ---------------- */
/* Renders a frozen results snapshot read-only. Never reads or writes localStorage
   or the live tournament, so opening a share link can't disturb the visitor's own
   in-progress game. */
function renderSharedView(snap) {
  const st = filterStandings(Engine.standings(snap), snap);
  const [p1, p2, p3] = st;            // podium follows the group filter (top 3 of the view)
  const dateStr = snap.createdAt ? new Date(snap.createdAt).toLocaleDateString() : '';
  const fmt = formatLabel(snap.config);
  const played = snap.rounds.filter(r => Engine.anyScores(r)).length;
  const colors = ['#cdf545', '#5fd4f5', '#f5b945', '#f56960', '#e8edf2'];
  const confetti = Array.from({ length: 40 }, (_, i) =>
    `<div class="confetti" style="left:${Math.random() * 100}%;background:${colors[i % colors.length]};animation-delay:${(Math.random() * 1.2).toFixed(2)}s;transform:rotate(${Math.random() * 360}deg)"></div>`).join('');
  app.innerHTML = `
  <div class="screen">
    <div class="content" style="padding-top:24px">
      <div class="results-inner">
        <div style="display:inline-block;background:var(--lime);color:#15200a;font-weight:800;font-size:.66rem;letter-spacing:.08em;padding:5px 11px;border-radius:999px;margin-bottom:6px">👁 READ-ONLY · SHARED RESULTS</div>
        ${groupFilterHTML(snap.config)}
        <div class="podium-wrap">
          ${confetti}
          <h2>Final standings</h2>
          <div class="sub">${esc(snap.config.name)} · ${fmt} · ${played} round${played === 1 ? '' : 's'}${dateStr ? ' · ' + esc(dateStr) : ''}</div>
          <div class="podium">
            ${p2 ? `<div class="pod p2"><div class="pname">${esc(p2.player.name)}</div><div class="ppts">${Math.round(p2.points)} ${scoreUnit(snap.config)}</div><div class="block">2</div></div>` : ''}
            ${p1 ? `<div class="pod p1"><div class="pname">${esc(p1.player.name)}</div><div class="ppts">${Math.round(p1.points)} ${scoreUnit(snap.config)}</div><div class="block">1</div></div>` : ''}
            ${p3 ? `<div class="pod p3"><div class="pname">${esc(p3.player.name)}</div><div class="ppts">${Math.round(p3.points)} ${scoreUnit(snap.config)}</div><div class="block">3</div></div>` : ''}
          </div>
        </div>
        ${standingsTableHTML(snap)}
        ${scoreViewsHTML(snap)}
        ${roundByRoundHTML(snap)}
      </div>
      ${footerHTML()}
    </div>
  </div>`;
  wireGroupFilter(app, () => renderSharedView(snap));
}

function renderShareError() {
  app.innerHTML = `
  <div class="screen">
    <div class="content" style="padding-top:60px">
      <div class="results-inner" style="text-align:center">
        <div style="font-size:2.6rem;margin-bottom:10px">🔗</div>
        <h2 style="margin:0 0 6px">Link looks incomplete</h2>
        <div class="sub">This shared results link is broken or got cut off in transit. Ask whoever shared it for the full link.</div>
      </div>
      ${footerHTML()}
    </div>
  </div>`;
}

/* ---------------- root ---------------- */

// Shared read-only results link (#r=…): decode once at boot. If present, the app
// renders the frozen snapshot read-only and never loads or saves the live tournament.
let sharedView = null, sharedError = false;
(function parseShareLink() {
  const m = location.hash.match(/^#r=(.+)$/);
  if (!m) return;
  try { sharedView = decodeShare(m[1]); }
  catch (e) { sharedError = true; }
})();

let lastScreen = null;
function render() {
  closeSheet();
  if (sharedView) { try { renderSharedView(sharedView); } catch (e) { renderShareError(); } return; }
  if (sharedError) { renderShareError(); return; }
  if (checkin) {
    renderReadiness();
  } else if (!T) {
    if (!setupState) setupState = defaultSetup();
    renderSetup();
  } else {
    renderPlay();
  }
  // Reset scroll to the top on a real screen/tab change — each transition is triggered
  // by a button at the bottom of the previous screen, so without this the new screen
  // inherits the old bottom scroll. In-place re-renders (scoring, round nav) keep position.
  const screen = checkin ? 'checkin' : !T ? 'setup' : T.finished ? 'results' : 'play:' + tab;
  if (screen !== lastScreen) { window.scrollTo(0, 0); lastScreen = screen; }
}

const warn = document.getElementById('js-warn');
if (warn) warn.remove();
render();
})();
</script>

      <div class="setup-players">
      <div class="field-label">${fixed ? 'Teams' : 'Players'} <span class="hint">${fixed
        ? `${teams} team${teams === 1 ? '' : 's'} ${teams >= s.courts * 2 ? '' : `(need ${s.courts * 2} for ${s.courts} court${s.courts > 1 ? 's' : ''})`}`
        : mixed
          ? `${cntA} + ${cntB} entered ${startOk ? '' : `(need ${s.courts * 2} per group, equal sizes)`}`
          : `${filled} entered ${filled >= s.courts * 4 ? '' : `(need ${s.courts * 4} for ${s.courts} court${s.courts > 1 ? 's' : ''})`}`}</span></div>
      ${s.format === 'americano' ? `
      <div class="seg" id="seg-skillmode" style="margin-bottom:10px">
        <button data-v="0" class="${!s.useSkills ? 'on' : ''}">No skill levels</button>
        <button data-v="1" class="${s.useSkills ? 'on' : ''}">Skill levels</button>
      </div>
      ${s.useSkills ? `<div class="setup-note" style="margin:0 0 10px">Tap a player’s badge to cycle — <b style="color:var(--lime)">+</b> stronger · <b>•</b> middle · <b style="color:var(--amber)">−</b> weaker, relative to your group. ${fixed ? 'A team’s strength is its two players combined; draws avoid lopsided team-vs-team games.' : 'Draws then avoid lopsided matches (the strongest two never gang up on the weakest two).'}</div>` : ''}` : ''}
      <div id="player-list">
        ${fixed ? teamCardsHTML(s) : mixed ? mixedListsHTML(s) : s.players.map((n, i) => `
          <div class="player-row">
            <span class="pnum">${i + 1}</span>
            <input data-pi="${i}" value="${esc(n)}" placeholder="Player name" autocomplete="off" enterkeyhint="next">
            ${s.format === 'americano' && s.useSkills ? `<button class="skill-badge sk${s.skills[i]}" data-sk="${i}">${SKILL_GLYPH[s.skills[i]]}</button>` : ''}
            <button class="del" data-del="${i}" aria-label="Remove">✕</button>
          </div>`).join('')}
      </div>
      ${mixed ? '' : `<button class="btn btn-ghost btn-block" id="add-player-row">${fixed ? '+ Add team' : '+ Add player'}</button>`}
      </div>

      <div class="setup-settings">
      <div class="field-label">Courts <span class="hint">${units >= (fixed ? 2 : 4) ? `${usedCourts} used · ${resting}${fixed ? ` team${resting === 1 ? '' : 's'}` : ''} sit out per round` : ''}</span></div>
      <div class="stepper" id="courts-stepper">
        <button data-step="-1">−</button>
        <div class="stepper-val">${s.courts}</div>
        <button data-step="1">+</button>
      </div>

      <div class="field-label">Scoring</div>
      <div class="seg" id="seg-scoring">
        <button data-v="rally" class="${!isGames ? 'on' : ''}">Rally points</button>
        <button data-v="games" class="${isGames ? 'on' : ''}">Games (first to N)</button>
      </div>

      ${isGames ? `
      <div class="field-label">Games per match <span class="hint">first to N wins</span></div>
      <div class="preset-row" id="games-presets">
        ${gamePresets.map(p => `<button class="chipbtn ${s.gamesTarget === p ? 'on' : ''}" data-gt="${p}">${p}</button>`).join('')}
      </div>
      <div class="setup-note">Each round is a mini-set with normal <b>15·30·40 · golden point</b> scoring — first to <b>${s.gamesTarget} games</b> wins. The leaderboard counts <b>games won</b>, not rally points. Enter the games score (e.g. ${s.gamesTarget}–${Math.max(0, s.gamesTarget - 2)}) after each round.</div>
      ` : `
      <div class="field-label">Points per match</div>
      <div class="preset-row" id="points-presets">
        ${presets.map(p => `<button class="chipbtn ${!s.customPoints && s.pointsPerMatch === p ? 'on' : ''}" data-pts="${p}">${p}</button>`).join('')}
        <input class="chipbtn ${s.customPoints ? 'on' : ''}" id="custom-pts" type="number" inputmode="numeric" min="2" max="99" placeholder="…" value="${s.customPoints ? s.pointsPerMatch : ''}">
      </div>
      <div class="setup-note">Teams rally to a <b>combined ${s.pointsPerMatch} points</b> per match (e.g. ${Math.ceil(s.pointsPerMatch * 0.58)}–${s.pointsPerMatch - Math.ceil(s.pointsPerMatch * 0.58)}). Serve switches every 4 points. 24 is the standard; 32 for longer matches.</div>

      <div class="field-label">Score entry</div>
      <div class="seg" id="seg-entry">
        <button data-v="combined" class="${s.scoreEntry === 'combined' ? 'on' : ''}">Adds to ${s.pointsPerMatch}</button>
        <button data-v="free" class="${s.scoreEntry === 'free' ? 'on' : ''}">Free score</button>
      </div>
      <div class="setup-note">${s.scoreEntry === 'combined'
        ? 'Enter one team’s points — the other side fills itself. Strict Americano.'
        : 'Enter both numbers, any total — for timed rounds or relaxed counting.'}</div>
      `}

      <div class="field-label">Ranking</div>
      <div class="seg" id="seg-ranking">
        <button data-v="points" class="${s.ranking === 'points' ? 'on' : ''}">${isGames ? 'Total games' : 'Total points'}</button>
        <button data-v="wins" class="${s.ranking === 'wins' ? 'on' : ''}">Wins first</button>
      </div>

      <div class="field-label">Sit-out ${isGames ? 'games' : 'points'}</div>
      <div class="seg" id="seg-restcomp">
        <button data-m="none" class="${s.restMode === 'none' ? 'on' : ''}">None</button>
        <button data-m="half" class="${s.restMode === 'half' ? 'on' : ''}">+${restHalf} fixed</button>
        <button data-m="avg" class="${s.restMode === 'avg' ? 'on' : ''}">Their avg</button>
      </div>
      <div class="setup-note">${{
        none: `When rounds don’t divide evenly, some players get one ${isGames ? 'match' : 'game'} more than others. Compensation levels that out.`,
        half: `Each sit-out credits <b>half a ${isGames ? 'set (' + restHalf + ' games)' : 'match (the average score)'}</b> — so resting is neutral for everyone.`,
        avg: `Each sit-out credits the player’s <b>own ${isGames ? 'games' : 'points'}-per-${isGames ? 'match' : 'game'} so far</b> — like ranking by average. Strong players keep their pace while resting.`,
      }[s.restMode]} You can switch this anytime — in Settings during the match, or right on the standings.</div>

      <div class="field-label">Session</div>
      <div class="seg" id="seg-duration">
        ${[90, 120, 150].map(d => `<button data-v="${d}" class="${s.durationMin === d ? 'on' : ''}">${d / 60}h</button>`).join('')}
      </div>
      <div class="field-label">Rounds <span class="hint">${s.plannedRounds ? 'manual' : 'suggested for ' + (s.durationMin / 60) + 'h'}</span></div>
      <div class="stepper" id="rounds-stepper">
        <button data-step="-1">−</button>
        <div class="stepper-val">${rounds}</div>
        <button data-step="1">+</button>
      </div>
      <div class="setup-note">${(() => {
        if (units < (fixed ? 2 : 4)) return '';
        const gp = rounds * perCourt * usedCourts / units;
        const lo = Math.floor(gp), hi = Math.ceil(gp);
        const who = fixed ? 'team' : 'player';
        return `<b>≈ ${lo === hi ? lo : lo + '–' + hi} ${isGames ? 'matches' : 'games'} per ${who}.</b> `;
      })()}You can always add extra rounds while playing.${fixed ? ' You can add or remove a whole team mid-session.' : mixed ? ' Players can join or leave mid-session — every pair always stays one from each group.' : ' Rounds are drawn one at a time, so players can join or leave mid-session.'}</div>
      </div>

      <div class="setup-footer">
      <div style="margin-top:28px">
        <button class="btn btn-primary btn-block" id="start-btn" ${startOk ? '' : 'disabled'} style="font-size:1.25rem;padding:18px">Start tournament</button>
      </div>
      </div>
    </div>
    ${footerHTML()}
  </div>`;

  // events
  app.querySelectorAll('[data-pi]').forEach(inp => {
    inp.addEventListener('input', e => { s.players[+e.target.dataset.pi] = e.target.value; updateSetupMeta(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const i = +e.target.dataset.pi;
        if (mixed) {
          // stay inside this group's list: next row of the group, or append to it
          const g = s.groups[i] || 'A';
          const next = s.players.findIndex((_, k) => k > i && (s.groups[k] || 'A') === g);
          if (next !== -1) { focusPlayer(next); return; }
          s.players.push(''); s.skills.push(2); s.groups.push(g);
          renderSetup(); focusPlayer(s.players.length - 1);
          return;
        }
        if (i === s.players.length - 1) { s.players.push(''); s.skills.push(2); s.groups.push('B'); renderSetup(); focusPlayer(s.players.length - 1); }
        else focusPlayer(i + 1);
      }
    });
  });
  app.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => {
    const i = +e.currentTarget.dataset.del;
    s.players.splice(i, 1);
    s.skills.splice(i, 1);
    s.groups.splice(i, 1);
    if (s.players.length === 0) { s.players.push(''); s.skills.push(2); s.groups.push('A'); }
    renderSetup();
  }));
  app.querySelectorAll('[data-delteam]').forEach(b => b.addEventListener('click', e => {
    const ti = +e.currentTarget.dataset.delteam;
    s.players.splice(ti * 2, 2);
    s.skills.splice(ti * 2, 2);
    s.groups.splice(ti * 2, 2);
    while (s.players.length < 4) { s.players.push(''); s.skills.push(2); s.groups.push('B'); }
    renderSetup();
  }));
  const apr = $('#add-player-row');
  if (apr) apr.addEventListener('click', () => {
    if (fixed) { s.players.push('', ''); s.skills.push(2, 2); s.groups.push('A', 'B'); renderSetup(); focusPlayer(s.players.length - 2); }
    else { s.players.push(''); s.skills.push(2); s.groups.push('B'); renderSetup(); focusPlayer(s.players.length - 1); }
  });
  app.querySelectorAll('[data-addg]').forEach(b => b.addEventListener('click', () => {
    s.players.push(''); s.skills.push(2); s.groups.push(b.dataset.addg === 'B' ? 'B' : 'A');
    renderSetup(); focusPlayer(s.players.length - 1);
  }));
  app.querySelectorAll('[data-gn]').forEach(inp => {
    // live-update the matching add-button label in place — a blur-triggered re-render
    // would detach the button under the user's finger and swallow their first tap
    inp.addEventListener('input', e => {
      const gi = +e.target.dataset.gn;
      s.groupNames[gi] = e.target.value;
      const g = gi === 1 ? 'B' : 'A';
      const btn = app.querySelector(`[data-addg="${g}"]`);
      if (btn) btn.textContent = '+ Add to ' + (e.target.value.trim() || 'Group ' + g);
    });
  });
  const skm = $('#seg-skillmode');
  if (skm) skm.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    s.useSkills = b.dataset.v === '1';
    renderSetup();
  }));
  $('#seg-restcomp').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    s.restMode = b.dataset.m;
    renderSetup();
  }));
  app.querySelectorAll('[data-sk]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.sk;
    s.skills[i] = nextSkill(s.skills[i]);
    b.className = 'skill-badge sk' + s.skills[i];
    b.textContent = SKILL_GLYPH[s.skills[i]];
  }));
  $('#courts-stepper').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    s.courts = Math.min(6, Math.max(1, s.courts + (+b.dataset.step)));
    renderSetup();
  }));
  $('#rounds-stepper').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    s.plannedRounds = Math.max(1, (s.plannedRounds || suggestedRounds(s)) + (+b.dataset.step));
    renderSetup();
  }));
  const segHandler = (id, key) => { const el = $(id); if (el) el.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { s[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; if (key === 'durationMin') s.plannedRounds = null; renderSetup(); })); };
  segHandler('#seg-scoring', 'scoring');
  segHandler('#seg-entry', 'scoreEntry');
  segHandler('#seg-ranking', 'ranking');
  segHandler('#seg-duration', 'durationMin');
  const gp = $('#games-presets');
  if (gp) gp.querySelectorAll('[data-gt]').forEach(b => b.addEventListener('click', () => {
    s.gamesTarget = +b.dataset.gt; s.plannedRounds = null; renderSetup();
  }));
  const pp = $('#points-presets');
  if (pp) pp.querySelectorAll('[data-pts]').forEach(b => b.addEventListener('click', () => {
    s.pointsPerMatch = +b.dataset.pts; s.customPoints = false; s.plannedRounds = null; renderSetup();
  }));
  const cp = $('#custom-pts');
  if (cp) {
    cp.addEventListener('input', e => {
      const v = parseInt(e.target.value, 10);
      if (v >= 2) { s.pointsPerMatch = v; s.customPoints = true; s.plannedRounds = null; updateSetupMeta(); }
    });
    cp.addEventListener('blur', () => renderSetup());
  }
  $('#start-btn').addEventListener('click', openCheckin);
  $('#setup-back').addEventListener('click', () => { s.step = 1; renderSetup(); window.scrollTo(0, 0); });

  function focusPlayer(i) {
    const el = app.querySelector(`[data-pi="${i}"]`);
    if (el) el.focus();
  }
  function updateSetupMeta() {
    if (fixed) {
      const tms = completeTeams(s);
      const need = s.courts * 2;
      $('#start-btn').toggleAttribute('disabled', tms < need);
      const hint = app.querySelector('.field-label .hint');
      if (hint) hint.textContent = `${tms} team${tms === 1 ? '' : 's'} ${tms >= need ? '' : `(need ${need} for ${s.courts} court${s.courts > 1 ? 's' : ''})`}`;
      return;
    }
    if (mixed) {
      const a = s.players.filter((n, i) => n.trim() && (s.groups[i] || 'A') === 'A').length;
      const b = s.players.filter((n, i) => n.trim() && (s.groups[i] || 'A') === 'B').length;
      const need = s.courts * 2;
      const okNow = a === b && a >= need;
      $('#start-btn').toggleAttribute('disabled', !okNow);
      const hint = app.querySelector('.field-label .hint');
      if (hint) hint.textContent = `${a} + ${b} entered ${okNow ? '' : `(need ${need} per group, equal sizes)`}`;
      return;
    }
    const f = s.players.filter(n => n.trim()).length;
    const need = s.courts * 4;
    $('#start-btn').toggleAttribute('disabled', f < need);
    const hint = app.querySelector('.field-label .hint');
    if (hint) hint.textContent = `${f} entered ${f >= need ? '' : `(need ${need} for ${s.courts} court${s.courts > 1 ? 's' : ''})`}`;
  }
}

/* ---------------- readiness check-in (late arrivals) ---------------- */

// Pressing "Start tournament" routes here: tick who's here, start when courts can be
// filled (courts×4). Anyone left un-ticked is a late arrival — on the roster but
// pending, joining the draw once checked in (see openReadinessSheet during play).
function openCheckin() {
  const s = setupState;
  // Fixed pairs: everyone is present at start (no late-arrival check-in) — go straight in.
  if (s.format === 'americano' && s.fixedPairs) { commitFixedPairs(); return; }
  // Mixed groups: same — the equal-group gate assumes everyone is present at start.
  if (s.format === 'americano' && s.mixedGroups) { commitMixed(); return; }
  const roster = s.players.map((n, i) => ({ name: n.trim(), skill: s.skills[i] || 2 })).filter(r => r.name);
  const lower = roster.map(r => r.name.toLowerCase());
  if (new Set(lower).size !== lower.length) { toast('Player names must be unique', true); return; }
  const need = s.courts * 4;
  if (roster.length < need) { toast(`Need ${need} players for ${s.courts} court${s.courts > 1 ? 's' : ''}`, true); return; }
  checkin = { roster, ready: roster.map(() => false) };
  render();
}

// Build the team roster from consecutive complete pairs and start immediately.
function commitFixedPairs() {
  const s = setupState;
  const teams = [], allNames = [], skillsByName = {};
  for (let i = 0; i + 1 < s.players.length; i += 2) {
    const a = s.players[i].trim(), b = s.players[i + 1].trim();
    if (!a || !b) continue;
    const ska = s.skills[i] || 2, skb = s.skills[i + 1] || 2;
    teams.push([{ name: a, skill: ska }, { name: b, skill: skb }]);
    allNames.push(a, b);
    skillsByName[a.toLowerCase()] = ska; skillsByName[b.toLowerCase()] = skb;
  }
  const lower = allNames.map(n => n.toLowerCase());
  if (new Set(lower).size !== lower.length) { toast('Player names must be unique', true); return; }
  if (teams.length < s.courts * 2) { toast(`Need ${s.courts * 2} teams for ${s.courts} court${s.courts > 1 ? 's' : ''}`, true); return; }
  const ok = mutate(() => {
    T = Engine.createTournament({
      fixedPairs: true,
      teams,
      useSkills: s.useSkills,
      restMode: s.restMode,
      courts: s.courts,
      format: 'americano',
      scoring: s.scoring,
      pointsPerMatch: s.pointsPerMatch,
      gamesTarget: s.gamesTarget,
      scoreEntry: s.scoring === 'games' ? 'free' : s.scoreEntry,
      ranking: s.ranking,
      plannedRounds: s.plannedRounds || suggestedRounds(s),
      durationMin: s.durationMin,
      createdAt: Date.now(),
    });
    T.config.durationMin = s.durationMin;
    Engine.refillPlanned(T); // pre-draw the full schedule
    store.saveLastPlayers(allNames, skillsByName, s.useSkills);
    checkin = null;
    tab = 'rounds';
    viewRound = 0;
  });
  if (!ok) { T = null; }
}

// Build the mixed-groups roster from the two lists and start immediately.
function commitMixed() {
  const s = setupState;
  groupFilter = 'all';   // fresh tournament, fresh standings filter
  const players = [], skillsByName = {}, groupsByName = {};
  let nA = 0, nB = 0;
  s.players.forEach((n, i) => {
    const name = n.trim();
    if (!name) return;
    const g = (s.groups[i] || 'A') === 'B' ? 'B' : 'A';
    const sk = s.skills[i] || 2;
    players.push({ name, skill: sk, group: g });
    skillsByName[name.toLowerCase()] = sk;
    groupsByName[name.toLowerCase()] = g;
    if (g === 'A') nA++; else nB++;
  });
  const lower = players.map(p => p.name.toLowerCase());
  if (new Set(lower).size !== lower.length) { toast('Player names must be unique', true); return; }
  const gn = [String(s.groupNames[0] || '').trim() || 'Group A', String(s.groupNames[1] || '').trim() || 'Group B'];
  if (nA !== nB) { toast(`${gn[0]} and ${gn[1]} need the same number of players (${nA} vs ${nB})`, true); return; }
  if (nA < s.courts * 2) { toast(`Need ${s.courts * 2} players per group for ${s.courts} court${s.courts > 1 ? 's' : ''}`, true); return; }
  const ok = mutate(() => {
    T = Engine.createTournament({
      mixedGroups: true,
      groupNames: gn,
      players,
      useSkills: s.useSkills,
      restMode: s.restMode,
      courts: s.courts,
      format: 'americano',
      scoring: s.scoring,
      pointsPerMatch: s.pointsPerMatch,
      gamesTarget: s.gamesTarget,
      scoreEntry: s.scoring === 'games' ? 'free' : s.scoreEntry,
      ranking: s.ranking,
      plannedRounds: s.plannedRounds || suggestedRounds(s),
      durationMin: s.durationMin,
      createdAt: Date.now(),
    });
    T.config.durationMin = s.durationMin;
    Engine.refillPlanned(T); // pre-draw the full schedule
    store.saveLastPlayers(players.map(p => p.name), skillsByName, s.useSkills, groupsByName);
    checkin = null;
    tab = 'rounds';
    viewRound = 0;
  });
  if (!ok) { T = null; }
}

function renderReadiness() {
  const s = setupState, c = checkin;
  const need = s.courts * 4;
  const readyCount = c.ready.filter(Boolean).length;
  const allReady = readyCount === c.roster.length;
  const canStart = readyCount >= need;
  app.innerHTML = `
  <div class="screen">
    <div class="setup-hero">
      <div class="brand">Who's <em>ready?</em></div>
      <div class="tagline">Tick everyone who's here. Start once ${need} are in — latecomers join from round 2.</div>
    </div>
    <div class="setup-body">
      <div class="seg" id="ck-all" style="margin-bottom:12px">
        <button data-all="1" class="${allReady ? 'on lime' : ''}">${allReady ? '✓ Everyone here' : 'Select all'}</button>
        <button data-all="0" class="${readyCount === 0 ? 'on' : ''}">Clear</button>
      </div>
      <div id="ck-list">
        ${c.roster.map((r, i) => `
          <button class="ck-row ${c.ready[i] ? 'on' : ''}" data-ck="${i}">
            <span class="ck-box">${c.ready[i] ? '✓' : ''}</span>
            <span class="ck-name">${esc(r.name)}</span>
            <span class="ck-tag">${c.ready[i] ? 'here' : 'not yet'}</span>
          </button>`).join('')}
      </div>
      <div class="setup-footer">
        <div class="setup-note" style="text-align:center;margin:14px 0">${readyCount} of ${c.roster.length} ready · ${canStart ? 'ready to start ✓' : `need ${need - readyCount} more`}</div>
        <button class="btn btn-primary btn-block" id="ck-start" ${canStart ? '' : 'disabled'} style="font-size:1.25rem;padding:18px">Start round 1${allReady ? '' : ` with ${readyCount}`}</button>
        <button class="btn btn-ghost btn-block" id="ck-back" style="margin-top:10px">‹ Back to setup</button>
      </div>
    </div>
  </div>`;
  app.querySelectorAll('[data-ck]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.ck; c.ready[i] = !c.ready[i]; renderReadiness();
  }));
  app.querySelector('[data-all="1"]').addEventListener('click', () => { c.ready = c.roster.map(() => true); renderReadiness(); });
  app.querySelector('[data-all="0"]').addEventListener('click', () => { c.ready = c.roster.map(() => false); renderReadiness(); });
  app.querySelector('#ck-back').addEventListener('click', () => { checkin = null; render(); });
  const sb = app.querySelector('#ck-start');
  sb.addEventListener('click', e => busy(e.currentTarget, 'Drawing round 1…', commitCheckin));
}

function commitCheckin() {
  const s = setupState, c = checkin;
  const players = c.roster.map((r, i) => ({ name: r.name, skill: r.skill, arrived: c.ready[i] }));
  const names = c.roster.map(r => r.name);
  const ok = mutate(() => {
    T = Engine.createTournament({
      players,
      useSkills: s.format === 'americano' && s.useSkills,
      restMode: s.restMode,
      courts: s.courts,
      format: s.format,
      scoring: s.scoring,
      pointsPerMatch: s.pointsPerMatch,
      gamesTarget: s.gamesTarget,
      scoreEntry: s.scoring === 'games' ? 'free' : s.scoreEntry,
      ranking: s.ranking,
      plannedRounds: s.plannedRounds || suggestedRounds(s),
      durationMin: s.durationMin,
      createdAt: Date.now(),
    });
    T.config.durationMin = s.durationMin;
    if (T.config.format === 'americano') Engine.refillPlanned(T); // schedule upfront (capped at 2 while anyone is pending)
    else Engine.generateRound(T);                                  // mexicano: each round needs the previous scores
    store.saveLastPlayers(names, Object.fromEntries(c.roster.map(r => [r.name.toLowerCase(), r.skill])), s.useSkills);
    checkin = null;
    tab = 'rounds';
    viewRound = 0;
  });
  if (!ok) { T = null; } // creation failed — stay on the check-in screen
}

/* ---------------- play: header & tabs ---------------- */

function fmtClock(ms) {
  const neg = ms < 0;
  const totalS = Math.floor(Math.abs(ms) / 1000);
  const h = Math.floor(totalS / 3600);
  const body = h
    ? h + ':' + String(Math.floor(totalS / 60) % 60).padStart(2, '0')        // 1:56 (h:mm)
    : Math.floor(totalS / 60) + ':' + String(totalS % 60).padStart(2, '0');  // 43:12 (mm:ss)
  return (neg ? '+' : '') + body;
}

function sessionEnd() { return T.createdAt + (T.config.durationMin || 120) * 60000; }

function timerText() {
  if (!T || !T.createdAt) return '';
  return fmtClock(sessionEnd() - Date.now());
}

function renderPlay() {
  if (T.finished) { renderResults(); return; }
  const doneRounds = T.rounds.filter((_, i) => Engine.roundComplete(T, i)).length;
  app.innerHTML = `
  <div class="screen">
    <div class="topbar">
      <div class="grow">
        <div class="tname">${esc(T.config.name)}</div>
        <div class="tsub">${formatLabel(T.config)} · ${Engine.activePlayers(T).length} players · ${matchGoalText(T.config)} · round ${Math.min(viewRound + 1, T.rounds.length)}/${Math.max(T.config.plannedRounds, T.rounds.length)}</div>
      </div>
      <div class="timer-chip" id="timer-chip" title="Session time left — tap for details">⏳ ${timerText()}</div>
      <button class="menu-btn" id="menu-btn" aria-label="Menu">⋯</button>
    </div>
    <div class="panes">
      <div class="content pane ${tab === 'rounds' ? 'active' : ''}" id="pane-rounds"></div>
      <div class="content pane ${tab === 'standings' ? 'active' : ''}" id="pane-standings"></div>
    </div>
    ${footerHTML()}
    <div class="tabbar">
      <button id="tab-rounds" class="${tab === 'rounds' ? 'on' : ''}"><span class="ico">🎾</span>Rounds</button>
      <button id="tab-standings" class="${tab === 'standings' ? 'on' : ''}"><span class="ico">🏆</span>Standings</button>
    </div>
  </div>`;
  $('#menu-btn').addEventListener('click', openMenuSheet);
  $('#tab-rounds').addEventListener('click', () => { tab = 'rounds'; render(); });
  $('#tab-standings').addEventListener('click', () => { tab = 'standings'; render(); });
  $('#timer-chip').addEventListener('click', () => {
    const left = sessionEnd() - Date.now();
    const hrs = (T.config.durationMin || 120) / 60;
    const endStr = new Date(sessionEnd()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    toast(left >= 0
      ? `Session timer: ${fmtClock(left)} of your ${hrs}h session left (ends ~${endStr})`
      : `Session time is up (${fmtClock(left).slice(1)} over) — finish whenever you like`);
  });
  renderRoundsTab();
  renderStandingsTab();
  startTimer();
  void doneRounds;
}

function updateTimerChip() {
  const chip = $('#timer-chip');
  if (!chip || !T || T.finished) return false;
  const txt = timerText();
  const blinkOff = Math.floor(Date.now() / 1000) % 2 === 1;
  chip.innerHTML = '⏳ ' + txt.replace(':', `<span class="tick${blinkOff ? ' dim' : ''}">:</span>`);
  chip.classList.toggle('over', txt.startsWith('+'));
  return true;
}

function startTimer() {
  clearInterval(timerInterval);
  updateTimerChip();
  timerInterval = setInterval(() => {
    if (!updateTimerChip()) clearInterval(timerInterval);
  }, 1000);
}

// phones get locked between matches — refresh the clock the moment we're visible again
document.addEventListener('visibilitychange', () => { if (!document.hidden) updateTimerChip(); });
window.addEventListener('pageshow', () => updateTimerChip());

/* ---------------- rounds tab ---------------- */

function renderRoundsTab() {
  const c = $('#pane-rounds');
  viewRound = Math.max(0, Math.min(viewRound, T.rounds.length - 1));
  const r = T.rounds[viewRound];
  const isLast = viewRound === T.rounds.length - 1;
  const complete = Engine.roundComplete(T, viewRound);
  const planned = T.config.plannedRounds;
  const allPlannedDone = T.rounds.length >= planned && T.rounds.every((_, i) => Engine.roundComplete(T, i));
  const curIdx = currentRoundIdx(T);
  const isAmericano = T.config.format === 'americano';
  // future Americano rounds exist but may be redrawn if players/courts/skills change
  const provisional = isAmericano && viewRound > curIdx && !Engine.anyScores(r);
  // re-draw allowed for any stretch of score-free rounds at the tail
  const canRegen = !Engine.anyScores(r) &&
    T.rounds.slice(viewRound + 1).every(x => !Engine.anyScores(x)) &&
    (isAmericano || isLast);
  // ruled redraws: current round only, no pending arrivals, and the mode has rules
  const showRedrawOpts = canRegen && viewRound === curIdx &&
    !Engine.pendingPlayers(T).length && Engine.redrawRules(T).length > 0;
  // court-side scoring: live +/− tallies on the round being played (settings toggle)
  const liveOn = !!T.config.liveScoring && viewRound === curIdx;
  // late-arrivals: while anyone is pending the schedule is capped at PARTIAL_ROUND_CAP.
  // Past the cap, the next round is blocked until everyone checks in or is removed.
  const pend = Engine.pendingPlayers(T);
  const blockedByPending = pend.length > 0 && isLast && complete &&
    T.rounds.length >= Engine.PARTIAL_ROUND_CAP && T.rounds.length < planned;

  const dots = [];
  const total = Math.max(planned, T.rounds.length);
  for (let i = 0; i < total; i++) {
    const cls = i >= T.rounds.length ? 'future'
      : Engine.roundComplete(T, i) ? 'done'
      : Engine.anyScores(T.rounds[i]) ? 'part' : '';
    dots.push(`<i class="${cls} ${i === viewRound ? 'cur' : ''}"></i>`);
  }

  c.innerHTML = `
    <div class="round-nav">
      <button class="nav" id="rnav-prev" ${viewRound === 0 ? 'disabled' : ''}>‹</button>
      <div class="round-title">
        <h2>Round ${viewRound + 1}</h2>
        <div class="round-dots">${dots.join('')}</div>
        ${provisional ? '<span class="prov-chip" title="May change if players, courts or skills change before it is played">⚠ provisional draw</span>' : ''}
      </div>
      <button class="nav" id="rnav-next" ${isLast ? 'disabled' : ''}>›</button>
    </div>

    ${r.matches.map((m, mi) => {
      const scored = m.scoreA !== null;
      const locked = viewRound > curIdx;
      const aWin = scored && m.scoreA > m.scoreB, bWin = scored && m.scoreB > m.scoreA;
      const liveHere = liveOn && !scored;
      const lv = liveHere && m.live ? m.live : { a: 0, b: 0 };
      return `
      <div class="court-card ${scored ? 'scored' : ''} ${locked ? 'locked' : ''}" data-match="${mi}">
        <div class="court-head"><span class="cname">Court ${mi + 1}</span><span class="cname">${scored ? 'tap to edit' : locked ? `🔒 plays after round ${curIdx + 1}` : liveHere ? 'tally · tap to type' : 'tap to score'}</span></div>
        <div class="court-body">
          <div class="team">
            <span class="tp">${pname(m.teamA[0])}</span>
            <span class="tp">${pname(m.teamA[1])}</span>
          </div>
          <div class="vs-block">
            ${scored
              ? `<div class="vs-score"><span class="${aWin ? 'w' : ''}">${m.scoreA}</span><span class="dash">–</span><span class="${bWin ? 'w' : ''}">${m.scoreB}</span></div>`
              : liveHere
              ? `<div class="vs-score live"><span>${lv.a}</span><span class="dash">–</span><span>${lv.b}</span></div>`
              : '<div class="vs-empty">vs</div>'}
          </div>
          <div class="team right">
            <span class="tp">${pname(m.teamB[0])}</span>
            <span class="tp">${pname(m.teamB[1])}</span>
          </div>
        </div>
        ${liveHere ? liveRowHTML(mi, lv) : ''}
      </div>`;
    }).join('')}

    ${r.resting.length ? (() => {
      const restsSoFar = {};
      for (let i = 0; i <= viewRound; i++) for (const pid of T.rounds[i].resting) restsSoFar[pid] = (restsSoFar[pid] || 0) + 1;
      return `
    <div class="rest-row">
      <span class="rlabel">Sitting out</span>
      ${r.resting.map(pid => `<span class="chip">${pname(pid)}${restsSoFar[pid] > 1 ? ` <span style="color:var(--txt-faint)">×${restsSoFar[pid]}</span>` : ''}</span>`).join('')}
    </div>`;
    })() : ''}

    ${provisional ? '<div class="setup-note" style="margin-top:12px">This draw is provisional — it may be redrawn if players, courts or skill badges change before it’s played. Scores already entered are never touched.</div>' : ''}

    ${T.config.roundTimerMin && viewRound === curIdx ? roundTimerHTML(r) : ''}

    ${allPlannedDone ? `
    <div class="banner"><b>All ${T.rounds.length} rounds played!</b> Finish the tournament to crown the winner — or squeeze in another round.</div>` : ''}

    ${pend.length ? `
    <div class="banner ${blockedByPending ? 'gate' : ''}">
      ${blockedByPending
        ? `<b>Round ${T.rounds.length + 1} needs the full group.</b> ${pend.length} ${pend.length > 1 ? 'players have' : 'player has'} not checked in — check them in or remove no-shows to continue.`
        : `<b>${pend.length} ${pend.length > 1 ? 'players' : 'player'} not here yet.</b> Check them in as they arrive — they join from the next round.`}
    </div>` : ''}

    <div class="round-actions">
      ${complete && !isLast ? `<button class="btn btn-primary btn-block" id="goto-next-btn" style="font-size:1.2rem;padding:16px">Next round →</button>` : ''}
      ${pend.length ? `<button class="btn ${blockedByPending ? 'btn-primary' : 'btn-ghost'} btn-block" id="readiness-btn" ${blockedByPending ? 'style="font-size:1.2rem;padding:16px"' : ''}>${blockedByPending ? `✋ Check players in for round ${T.rounds.length + 1}` : '🕒 Manage arrivals'}</button>` : ''}
      ${!isAmericano && isLast && complete && !allPlannedDone && !blockedByPending ? `<button class="btn btn-primary btn-block" id="next-round-btn" style="font-size:1.2rem;padding:16px">Draw round ${T.rounds.length + 1} →</button>` : ''}
      ${allPlannedDone ? `
        <button class="btn btn-primary btn-block" id="finish-btn" style="font-size:1.2rem;padding:16px">🏆 Finish &amp; crown winner</button>
        <button class="btn btn-ghost btn-block" id="extra-round-btn">+ One more round</button>` : ''}
      ${canRegen ? `<button class="btn btn-ghost btn-block" id="regen-btn">⟲ ${showRedrawOpts ? 'Quick re-draw' : `Re-draw ${isAmericano && viewRound < T.rounds.length - 1 ? 'this & later rounds' : 'this round'}`}</button>` : ''}
      ${showRedrawOpts ? `<button class="btn btn-ghost btn-block" id="regen-opts-btn">✨ Re-draw options…</button>` : ''}
      <button class="btn btn-ghost btn-block" id="share-draws">📋 Copy round draws</button>
    </div>`;

  $('#rnav-prev').addEventListener('click', () => { viewRound--; render(); });
  $('#rnav-next').addEventListener('click', () => { viewRound++; render(); });
  const gnb = $('#goto-next-btn');
  if (gnb) gnb.addEventListener('click', () => { viewRound++; render(); });
  c.querySelectorAll('[data-match]').forEach(el => el.addEventListener('click', () => {
    if (viewRound > curIdx) { toast(`Round ${viewRound + 1} is locked — finish round ${curIdx + 1} first`); return; }
    openScoreSheet(viewRound, +el.dataset.match);
  }));
  // live tally controls sit inside the card — stop the tap from opening the score sheet
  c.querySelectorAll('[data-lm]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    liveTick(+btn.dataset.lm, btn.dataset.t, +btn.dataset.d);
  }));
  c.querySelectorAll('[data-lsave]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    liveCommit(+btn.dataset.lsave);
  }));
  const nb = $('#next-round-btn');
  if (nb) nb.addEventListener('click', () => {
    // Mexicano: confirm arrivals before drawing the next round when anyone's still pending
    if (Engine.pendingPlayers(T).length) { openReadinessSheet({ inter: true, nextRoundNo: T.rounds.length + 1 }); return; }
    busy(nb, 'Drawing…', () => mutate(() => { Engine.generateRound(T); viewRound = T.rounds.length - 1; }));
  });
  const eb = $('#extra-round-btn');
  if (eb) eb.addEventListener('click', () => busy(eb, 'Drawing…', () =>
    mutate(() => {
      if (T.config.format === 'americano') Engine.setPlannedRounds(T, T.rounds.length + 1);
      else { T.config.plannedRounds = T.rounds.length + 1; Engine.generateRound(T); }
      viewRound = T.rounds.length - 1;
    })));
  const rdb = $('#readiness-btn');
  if (rdb) rdb.addEventListener('click', () => openReadinessSheet(blockedByPending ? { gate: true } : {}));
  const rb = $('#regen-btn');
  if (rb) rb.addEventListener('click', () => {
    // in partial mode, confirm who's arrived before re-drawing so latecomers land in the new draw
    if (Engine.pendingPlayers(T).length) { openReadinessSheet({ redrawIdx: viewRound }); return; }
    busy(rb, 'Re-drawing…', () => mutate(() => { Engine.regenerateRound(T, viewRound); }));
  });
  const rob = $('#regen-opts-btn');
  if (rob) rob.addEventListener('click', () => openRedrawOptionsSheet(viewRound));
  const fb = $('#finish-btn');
  if (fb) fb.addEventListener('click', finishTournament);
  $('#share-draws').addEventListener('click', copyRoundDraws);
  wireRoundTimer(r);
}

/* ---- court-side (live) scoring ----
 * The running tally lives in m.live = {a, b} — UI scratch the engine never reads, so
 * partial tallies never count as scores: standings, roundComplete, redraw locks and
 * provisional-round logic all keep their invariants until the tally COMMITS through
 * Engine.setScore (same path as the score sheet). Persisted via store.saveCurrent so a
 * phone reload mid-game keeps the count; a redraw replaces the round object, tally included. */

function liveRowHTML(mi, lv) {
  const games = T.config.scoring === 'games';
  const N = games ? (T.config.gamesTarget || 4) : T.config.pointsPerMatch;
  const combined = !games && T.config.scoreEntry === 'combined';
  const mid = combined ? `<span data-lleft>${Math.max(0, N - lv.a - lv.b)} left</span>`
    : games ? `<span>first to ${N}</span>`
    : `<button class="live-save" data-lsave="${mi}" ${lv.a + lv.b ? '' : 'disabled'} aria-label="Save score">✓</button>`;
  return `
    <div class="live-row">
      <div class="live-side"><button data-lm="${mi}" data-t="a" data-d="-1" aria-label="Minus left team"></button><button data-lm="${mi}" data-t="a" data-d="1" aria-label="Plus left team"></button></div>
      <div class="live-mid">${mid}</div>
      <div class="live-side"><button data-lm="${mi}" data-t="b" data-d="-1" aria-label="Minus right team"></button><button data-lm="${mi}" data-t="b" data-d="1" aria-label="Plus right team"></button></div>
    </div>`;
}

function liveTick(mi, side, d) {
  const m = T.rounds[viewRound].matches[mi];
  if (m.scoreA !== null) return;
  const games = T.config.scoring === 'games';
  const N = games ? (T.config.gamesTarget || 4) : T.config.pointsPerMatch;
  const combined = !games && T.config.scoreEntry === 'combined';
  const lv = m.live || (m.live = { a: 0, b: 0 });
  const v = Math.max(0, lv[side] + d);
  if (combined && d > 0 && lv.a + lv.b >= N) return; // total is full — nothing left to bank
  if (games && v > N) return;                        // games cap at the target
  lv[side] = v;
  // natural end of the match → commit through the same path as the score sheet
  if ((combined && lv.a + lv.b === N) || (games && v === N)) { liveCommit(mi); return; }
  store.saveCurrent(T);
  updateLiveCard(mi);
}

function liveCommit(mi) {
  const m = T.rounds[viewRound].matches[mi];
  const lv = m.live || { a: 0, b: 0 };
  const prevIdx = currentRoundIdx(T);
  const r = viewRound;
  const okd = mutate(() => {
    delete m.live;
    Engine.setScore(T, r, mi, lv.a, lv.b);
  });
  if (okd) arrivalsCheckpoint(r, prevIdx);
  else { m.live = lv; store.saveCurrent(T); } // rejected — keep the tally on screen
}

/** in-place refresh of one card's tally (no full render — keeps scroll position) */
function updateLiveCard(mi) {
  const m = T.rounds[viewRound].matches[mi];
  const lv = m.live || { a: 0, b: 0 };
  const card = document.querySelector(`.court-card[data-match="${mi}"]`);
  if (!card) return;
  const vs = card.querySelector('.vs-block');
  if (vs) vs.innerHTML = `<div class="vs-score live"><span>${lv.a}</span><span class="dash">–</span><span>${lv.b}</span></div>`;
  const left = card.querySelector('[data-lleft]');
  if (left) {
    const N = T.config.pointsPerMatch;
    left.textContent = Math.max(0, N - lv.a - lv.b) + ' left';
  }
  const save = card.querySelector('[data-lsave]');
  if (save) save.disabled = !(lv.a + lv.b);
}

/* ---------------- round timer ---------------- */

let roundTickInt = null;

function fmtMMSS(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function roundTimerLeft(r) {
  if (!r.timer) return T.config.roundTimerMin * 60000;
  if (r.timer.endsAt) return r.timer.endsAt - Date.now();
  return r.timer.left;
}

function roundTimerHTML(r) {
  const left = roundTimerLeft(r);
  const running = !!(r.timer && r.timer.endsAt);
  return `
    <div class="rtimer ${left <= 0 ? 'done' : ''}" id="rtimer">
      <span class="t" id="rtimer-t">${left <= 0 ? 'TIME!' : fmtMMSS(left)}</span>
      ${r.timer ? '<button class="btn btn-ghost" id="rtimer-reset">⟲</button>' : ''}
      <button class="btn btn-ghost" id="rtimer-toggle">${running ? 'Pause' : (r.timer ? 'Resume' : 'Start')}</button>
    </div>`;
}

function wireRoundTimer(r) {
  clearInterval(roundTickInt);
  const tgl = $('#rtimer-toggle');
  if (!tgl) return;
  tgl.addEventListener('click', () => {
    if (r.timer && r.timer.endsAt) r.timer = { left: Math.max(0, r.timer.endsAt - Date.now()) };
    else r.timer = { endsAt: Date.now() + Math.max(0, roundTimerLeft(r)) };
    store.saveCurrent(T);
    render();
  });
  const rst = $('#rtimer-reset');
  if (rst) rst.addEventListener('click', () => { delete r.timer; store.saveCurrent(T); render(); });
  if (r.timer && r.timer.endsAt) {
    roundTickInt = setInterval(() => {
      const el = $('#rtimer-t');
      if (!el) { clearInterval(roundTickInt); return; }
      const left = r.timer && r.timer.endsAt ? r.timer.endsAt - Date.now() : 0;
      el.textContent = left <= 0 ? 'TIME!' : fmtMMSS(left);
      if (left <= 0) { $('#rtimer').classList.add('done'); clearInterval(roundTickInt); }
    }, 500);
  }
}

/* ---------------- standings tab ---------------- */

function prevStandingsRanks() {
  // ranks before the latest round that has any scores (for movement arrows)
  const lastScored = [...T.rounds].reverse().find(r => Engine.anyScores(r));
  if (!lastScored) return null;
  const clone = JSON.parse(JSON.stringify(T));
  const idx = T.rounds.indexOf(lastScored);
  for (const m of clone.rounds[idx].matches) { m.scoreA = null; m.scoreB = null; }
  const ranks = {};
  Engine.standings(clone).forEach((s, i) => { ranks[s.player.id] = i; });
  return ranks;
}

function renderStandingsTab() {
  const c = $('#pane-standings');
  const st = filterStandings(Engine.standings(T), T);
  const prev = prevStandingsRanks();
  // rank-movement arrows compare against overall ranks — only meaningful unfiltered
  const showMov = !T.config.mixedGroups || groupFilter === 'all';
  const maxPts = Math.max(1, ...st.map(s => s.points));
  const hasRests = T.rounds.some(r => r.resting.length);

  c.innerHTML = `
    <div class="pane-title">Standings</div>
    ${groupFilterHTML(T.config)}
    <table class="stand-table">
      <thead><tr>
        <th></th><th>${T.config.fixedPairs ? 'Team' : 'Player'}</th><th>${scoreUnitCap(T.config)}</th><th>±</th><th>W·D·L</th>${hasRests ? '<th>Rest</th>' : ''}
      </tr></thead>
      <tbody>
        ${st.map((s, i) => {
          let mov = '';
          if (prev && s.played > 0 && showMov) {
            const d = (prev[s.player.id] ?? i) - i;
            mov = d > 0 ? '<span class="mov up">▲</span>' : d < 0 ? '<span class="mov dn">▼</span>' : '<span class="mov">·</span>';
          }
          return `
          <tr class="top${i + 1}">
            <td class="rank">${i + 1}</td>
            <td class="pname">${esc(s.player.name)}${s.player.active ? '' : ' <span class="out">(left)</span>'}
              <div class="ptbar"><i style="width:${Math.round(100 * s.points / maxPts)}%"></i></div>
            </td>
            <td class="pts">${Math.round(s.points)}</td>
            <td style="color:${s.diff > 0 ? 'var(--lime)' : s.diff < 0 ? 'var(--red)' : 'var(--txt-faint)'}">${s.diff > 0 ? '+' : ''}${s.diff}</td>
            <td style="color:var(--txt-dim)">${mov}${s.wins}·${s.draws}·${s.losses}</td>
            ${hasRests ? `<td style="color:var(--txt-faint)">${s.rests}</td>` : ''}
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    ${hasRests ? (() => {
      const mode = T.config.restMode || (T.config.restPoints > 0 ? 'half' : 'none');
      const half = restHalfOf(T.config);
      return `
    <div class="field-label" style="margin-top:16px">Sit-out ${scoreUnit(T.config)} <span class="hint">recomputes live</span></div>
    <select class="pill-select" id="stand-rest">
      <option value="none" ${mode === 'none' ? 'selected' : ''}>None</option>
      <option value="half" ${mode === 'half' ? 'selected' : ''}>+${half} fixed</option>
      <option value="avg" ${mode === 'avg' ? 'selected' : ''}>Their avg</option>
    </select>`;
    })() : ''}
    <div class="setup-note" style="margin-top:14px">Ranked by ${T.config.ranking === 'wins' ? `<b>wins</b>, then ${scoreUnit(T.config)}` : `<b>total ${scoreUnit(T.config)}</b>`}, then ${T.config.scoring === 'games' ? 'game' : 'point'} difference. ${(() => {
      const mode = T.config.restMode || (T.config.restPoints > 0 ? 'half' : 'none');
      const unit = scoreUnit(T.config);
      return mode === 'half' ? `Each sit-out credits <b>+${restHalfOf(T.config)} ${unit}</b> (fixed).`
        : mode === 'avg' ? `Each sit-out credits the player’s <b>own ${unit}-per-${T.config.scoring === 'games' ? 'match' : 'game'}</b>.`
        : 'Sitting out earns nothing — the draw keeps everyone’s games even (±1).';
    })()} Tap a match card to enter scores.</div>`;

  const sr = c.querySelector('#stand-rest');
  if (sr) sr.addEventListener('change', () => {
    mutate(() => { T.config.restMode = sr.value; T.config.restPoints = 0; });
  });
  wireGroupFilter(c, renderStandingsTab);
}

/* ---------------- score sheet ---------------- */

function openScoreSheet(r, mi) {
  const m = T.rounds[r].matches[mi];
  const games = T.config.scoring === 'games';
  const N = games ? (T.config.gamesTarget || 4) : T.config.pointsPerMatch;
  const combined = !games && T.config.scoreEntry === 'combined';
  // games default: a fresh card starts at the winning target vs 0 (a valid first-to-N).
  // A court-side tally in progress carries into the sheet instead of the default —
  // combined mode keeps its sum-to-N link, so the other side follows the tallied one.
  const lv = m.scoreA === null && m.live ? m.live : null;
  scoreCtx = {
    r, mi,
    a: m.scoreA !== null ? m.scoreA : lv ? lv.a : (combined ? Math.floor(N / 2) : games ? N : 0),
    b: m.scoreB !== null ? m.scoreB : lv ? (combined ? N - lv.a : lv.b) : (combined ? Math.ceil(N / 2) : 0),
    existing: m.scoreA !== null,
  };
  renderScoreSheet();
}

function renderScoreSheet() {
  const { r, mi, a, b } = scoreCtx;
  const m = T.rounds[r].matches[mi];
  const games = T.config.scoring === 'games';
  const N = games ? (T.config.gamesTarget || 4) : T.config.pointsPerMatch;
  const combined = !games && T.config.scoreEntry === 'combined';
  const capMax = games ? N : null; // games: each side 0..N

  let ov = $('#score-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'score-overlay';
    ov.className = 'overlay';
    document.body.appendChild(ov);
  }
  ov.classList.add('open');
  sheetKeyboardAssist(ov);
  syncBodyLock();
  ov.innerHTML = `
    <div class="ovspace"></div>
    <div class="sheet">
      <div class="grab"></div>
      <h3>Round ${r + 1} · Court ${mi + 1}</h3>
      <div class="sub">${combined ? `Points add up to ${N} — set one side, the other follows.`
        : games ? `Games won — first to <b>${N}</b> wins the set.` : 'Enter both team scores.'}</div>
      <div class="score-grid">
        <div class="score-team ${a > b ? 'winning' : ''}" id="st-a">
          <div class="names">${pname(m.teamA[0])}<br>${pname(m.teamA[1])}</div>
          <input class="bignum" id="bn-a" type="number" inputmode="numeric" min="0" ${combined || games ? `max="${N}"` : ''} value="${a}">
          <div class="pmrow"><button data-t="a" data-d="-1">−</button><button data-t="a" data-d="1">+</button></div>
        </div>
        <div class="score-colon">:</div>
        <div class="score-team ${b > a ? 'winning' : ''}" id="st-b">
          <div class="names">${pname(m.teamB[0])}<br>${pname(m.teamB[1])}</div>
          <input class="bignum" id="bn-b" type="number" inputmode="numeric" min="0" ${combined || games ? `max="${N}"` : ''} value="${b}">
          <div class="pmrow"><button data-t="b" data-d="-1">−</button><button data-t="b" data-d="1">+</button></div>
        </div>
      </div>
      ${combined ? `<input type="range" class="score-slider" id="score-slider" min="0" max="${N}" step="1" value="${a}">` : ''}
      <div class="sheet-actions">
        ${scoreCtx.existing ? '<button class="btn btn-danger" id="score-clear">Clear</button>' : '<button class="btn btn-ghost" id="score-cancel">Cancel</button>'}
        <button class="btn btn-primary" id="score-save" style="flex:2">Save score</button>
      </div>
    </div>
    <div class="ovspace ovspace-b"></div>`;

  ov.querySelectorAll('.pmrow button').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const d = +btn.dataset.d, t = btn.dataset.t;
    if (combined) {
      // in combined mode the two sides are linked: +1 on one side is -1 on the other
      const na = Math.max(0, Math.min(N, t === 'a' ? scoreCtx.a + d : scoreCtx.a - d));
      scoreCtx.a = na;
      scoreCtx.b = N - na;
    } else {
      const cap = v => capMax === null ? Math.max(0, v) : Math.max(0, Math.min(capMax, v));
      if (t === 'a') scoreCtx.a = cap(scoreCtx.a + d);
      else scoreCtx.b = cap(scoreCtx.b + d);
    }
    lightUpdate(); // in-place, same as the slider — no sheet re-render per press
  }));
  const bnA = $('#bn-a'), bnB = $('#bn-b');
  const slider = $('#score-slider');
  const sliderBg = () => {
    // track fills lime from the winning team's end up to the thumb
    // (thumb right => left side fills; thumb left => right side fills);
    // a faint center tick marks the draw point
    if (!slider) return;
    const lime = 'rgba(205,245,69,.6)', dim = 'rgba(46,56,66,1)', mark = 'rgba(232,237,242,.4)';
    const p = (scoreCtx.a / N) * 100;
    let stops;
    if (scoreCtx.a > scoreCtx.b) stops = `${lime} 0 ${p}%, ${dim} ${p}% 100%`;
    else if (scoreCtx.b > scoreCtx.a) stops = `${dim} 0 ${p}%, ${lime} ${p}% 100%`;
    else stops = `${dim} 0 100%`;
    slider.style.setProperty('--trk',
      `linear-gradient(90deg, transparent 0 calc(50% - 1.5px), ${mark} calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px) 100%), linear-gradient(90deg, ${stops})`);
  };
  const lightUpdate = () => { // keep typing/drag smooth without a full re-render
    if (document.activeElement !== bnA) bnA.value = scoreCtx.a;
    if (document.activeElement !== bnB) bnB.value = scoreCtx.b;
    if (slider) slider.value = scoreCtx.a;
    sliderBg();
    ov.querySelector('#st-a').classList.toggle('winning', scoreCtx.a > scoreCtx.b);
    ov.querySelector('#st-b').classList.toggle('winning', scoreCtx.b > scoreCtx.a);
  };
  sliderBg(); // initial state (e.g. editing an existing score)
  if (slider) slider.addEventListener('input', e => {
    scoreCtx.a = +e.target.value; scoreCtx.b = N - scoreCtx.a;
    lightUpdate();
  });
  [bnA, bnB].forEach(inp => {
    inp.addEventListener('focus', () => inp.select());
    inp.addEventListener('input', () => {
      let v = parseInt(inp.value, 10);
      if (isNaN(v) || v < 0) return; // wait until the field holds a valid number
      if (combined) {
        v = Math.min(v, N);
        if (v !== parseInt(inp.value, 10)) inp.value = v;
        scoreCtx.a = inp === bnA ? v : N - v;
        scoreCtx.b = N - scoreCtx.a;
      } else {
        if (capMax !== null && v > capMax) { v = capMax; inp.value = v; }
        if (inp === bnA) scoreCtx.a = v; else scoreCtx.b = v;
      }
      lightUpdate();
    });
    inp.addEventListener('blur', () => { inp.value = inp === bnA ? scoreCtx.a : scoreCtx.b; });
  });
  $('#score-save').addEventListener('click', () => {
    // keep the sheet open if the score is rejected (e.g. games mode needs a first-to-N result)
    const prevIdx = currentRoundIdx(T);
    if (mutate(() => { Engine.setScore(T, r, mi, scoreCtx.a, scoreCtx.b); delete m.live; })) {
      closeScoreSheet();
      arrivalsCheckpoint(r, prevIdx);
    }
  });
  const sc = $('#score-cancel');
  if (sc) sc.addEventListener('click', closeScoreSheet);
  const cl = $('#score-clear');
  if (cl) cl.addEventListener('click', () => { mutate(() => { Engine.clearScore(T, r, mi); delete m.live; }); closeScoreSheet(); });
  ov.addEventListener('click', e => {
    if (e.target === ov || e.target.classList.contains('ovspace')) closeScoreSheet();
  });
}

function closeScoreSheet() {
  const ov = $('#score-overlay');
  if (ov) { ov.classList.remove('open'); ov.innerHTML = ''; }
  scoreCtx = null;
  syncBodyLock();
}

/* ---------------- menu / sheets ---------------- */

let bodyLockY = 0;
function syncBodyLock() {
  const anyOpen = !!document.querySelector('.overlay.open');
  const locked = document.body.classList.contains('sheet-lock');
  if (anyOpen && !locked) {
    bodyLockY = window.scrollY;
    document.body.style.top = -bodyLockY + 'px';
    document.body.classList.add('sheet-lock');
  } else if (!anyOpen && locked) {
    document.body.classList.remove('sheet-lock');
    document.body.style.top = '';
    window.scrollTo(0, bodyLockY);
  }
}

/* when the on-screen keyboard opens for an input inside a sheet, bring it into view */
function sheetKeyboardAssist(ov) {
  if (ov.dataset.kbAssist) return;
  ov.dataset.kbAssist = '1';
  ov.addEventListener('focusin', e => {
    if (e.target.matches('input')) {
      setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 300);
    }
  });
}

function sheet(html) {
  let ov = $('#gen-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'gen-overlay';
    ov.className = 'overlay';
    document.body.appendChild(ov);
  }
  ov.classList.add('open');
  ov.innerHTML = `<div class="ovspace"></div><div class="sheet">${html}</div><div class="ovspace ovspace-b"></div>`;
  ov.addEventListener('click', e => {
    if (e.target === ov || e.target.classList.contains('ovspace')) closeSheet();
  });
  sheetKeyboardAssist(ov);
  syncBodyLock();
  return ov;
}
function closeSheet() {
  const ov = $('#gen-overlay');
  if (ov) { ov.classList.remove('open'); ov.innerHTML = ''; }
  syncBodyLock();
}

      <button class="btn" id="mi-share"><span class="ico">📋</span>Copy standings</button>
      <button class="btn" id="mi-export"><span class="ico">💾</span>Export backup</button>

      <button class="btn" id="mi-finish"><span class="ico">🏆</span>Finish tournament</button>
      <button class="btn btn-danger" id="mi-abandon"><span class="ico">🗑</span>Abandon (no winner)</button>

function confirmSheet(title, body, cta, fn) {
  const ov = sheet(`
    <div class="grab"></div>
    <div class="confirm-box">
      <h3>${esc(title)}</h3>
      <p>${esc(body)}</p>

/** Host redraw options: one-shot rank-based rules for the current round. The engine's
 *  redrawRules enumerates what fits this mode — empty means the button never shows. */
function openRedrawOptionsSheet(idx) {
  const rules = Engine.redrawRules(T);
  if (!rules.length) return;
  const ov = sheet(`
    <div class="grab"></div>
    <h3>Re-draw round ${idx + 1}</h3>
    <div class="setup-note" style="margin:4px 0 12px">Pairing follows the <b>current standings</b> and applies to this round only — later rounds return to the normal draw. Sitting out stays fair either way.</div>
    <div class="menu-list">
      ${rules.map(r => `
      <button class="btn rule-btn" data-rule="${r.id}">
        <span class="rule-name">${esc(r.label)}</span>
        <span class="rule-blurb">${esc(r.blurb)}</span>
      </button>`).join('')}
    </div>`);
  ov.querySelectorAll('[data-rule]').forEach(el => el.addEventListener('click', () => {
    const id = el.getAttribute('data-rule');
    closeSheet();
    mutate(() => { Engine.regenerateRoundRuled(T, idx, id); });
  }));
}

function openPlayersSheet(editPid) {
  const st = Engine.standings(T);
  const byId = {};
  st.forEach(s => { byId[s.player.id] = s; });
  const mixed = !!T.config.mixedGroups;
  const gn = T.config.groupNames || ['Group A', 'Group B'];
  const rowHTML = p => `
        <div class="player-row" style="${p.active ? '' : 'opacity:.55'}">
          <span class="pnum">${mixed ? esc((p.group === 'B' ? gn[1] : gn[0]).charAt(0).toUpperCase() || '•') : '•'}</span>
          ${p.id === editPid
            ? `<input id="pl-edit" value="${esc(p.name)}" autocomplete="off" enterkeyhint="done">`
            : `<div style="flex:1;min-width:0">
                 <div style="font-weight:600">${esc(p.name)}${p.active ? '' : ' (left)'}</div>
                 <div class="pstat">${Math.round(byId[p.id].points)} ${scoreUnit(T.config)} · ${byId[p.id].played} ${T.config.scoring === 'games' ? 'matches' : 'games'} · ${byId[p.id].rests} rests</div>
               </div>`}
          ${p.id === editPid
            ? `<button class="del" id="pl-save" style="color:var(--lime)">✓</button>`
            : p.active
              ? `${T.config.format === 'americano' && T.config.useSkills ? `<button class="skill-badge sk${p.skill || 2}" data-skp="${p.id}">${SKILL_GLYPH[p.skill || 2]}</button>` : ''}<button class="del" data-ed="${p.id}">✎</button><button class="del" data-rm="${p.id}">✕</button>`
              : `<button class="del" data-rj="${p.id}" style="color:var(--lime);font-size:.9rem;width:auto;padding:0 12px">↩ rejoin</button>`}
        </div>`;
  const groupHeader = name => `<div class="sub" style="margin:10px 0 6px;font-weight:700;color:var(--lime);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem">${esc(name)}</div>`;
  const listHTML = mixed
    ? groupHeader(gn[0]) + T.players.filter(p => p.group !== 'B').map(rowHTML).join('')
      + groupHeader(gn[1]) + T.players.filter(p => p.group === 'B').map(rowHTML).join('')
    : T.players.map(rowHTML).join('');
  // mixed: a new player must pick a group — default to the smaller active side
  const g0 = mixed ? Engine.activeByGroup(T) : null;
  let npGroup = mixed ? (g0.B.length < g0.A.length ? 'B' : 'A') : null;
  const ov = sheet(`
    <div class="grab"></div>
    <h3>Players</h3>
    <div class="sub">Rename ✎, remove ✕ (results kept, they can rejoin), add below. Changes apply from the next draw.</div>
    <div class="proster">
      ${listHTML}
    </div>
    ${mixed ? `
    <div class="seg" id="np-group" style="margin-top:10px">
      <button data-g="A" class="${npGroup === 'A' ? 'on' : ''}">${esc(gn[0])}</button>
      <button data-g="B" class="${npGroup === 'B' ? 'on' : ''}">${esc(gn[1])}</button>
    </div>` : ''}
    <div class="player-row" style="margin-top:10px">
      <span class="pnum">+</span>
      <input id="np-name" placeholder="New player name" autocomplete="off">
      <button class="del" id="np-add" style="color:var(--lime);font-size:1.5rem">+</button>
    </div>`);
  const npg = ov.querySelector('#np-group');
  if (npg) npg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    npGroup = b.dataset.g;
    npg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  }));
  ov.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    const p = T.players.find(x => x.id === b.dataset.rm);
    confirmSheet(`Remove ${p.name}?`, 'They keep their points and can rejoin later from this list.', 'Remove', () => {
      mutate(() => Engine.removePlayer(T, p.id));
      openPlayersSheet();
    });
  }));
  ov.querySelectorAll('[data-ed]').forEach(b => b.addEventListener('click', () => openPlayersSheet(b.dataset.ed)));
  ov.querySelectorAll('[data-skp]').forEach(b => b.addEventListener('click', () => {
    const p = T.players.find(x => x.id === b.dataset.skp);
    const ns = nextSkill(p.skill || 2);
    mutate(() => Engine.setSkill(T, p.id, ns));
    openPlayersSheet();
  }));
  ov.querySelectorAll('[data-rj]').forEach(b => b.addEventListener('click', () => {
    const p = T.players.find(x => x.id === b.dataset.rj);
    mutate(() => Engine.reactivatePlayer(T, p.id));
    toast(p.name + ' rejoins from the next draw');
    openPlayersSheet();
  }));
  const editInp = ov.querySelector('#pl-edit');
  if (editInp) {
    const commit = () => {
      const v = editInp.value.trim();
      const p = T.players.find(x => x.id === editPid);
      if (v && v !== p.name) mutate(() => Engine.renamePlayer(T, editPid, v));
      openPlayersSheet();
    };
    editInp.focus();
    editInp.select();
    ov.querySelector('#pl-save').addEventListener('click', commit);
    editInp.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') openPlayersSheet(); });
  }
  ov.querySelector('#np-add').addEventListener('click', () => {
    const name = ov.querySelector('#np-name').value.trim();
    if (!name) return;
    if (T.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast('Name already in use', true); return; }
    if (!mutate(() => Engine.addPlayer(T, name, undefined, 2, npGroup || undefined))) return;
    toast(name + ' joins from the next draw');
    openPlayersSheet();
  });
}

/** Fixed-pairs roster management: rename players, cycle skill, remove/rejoin or add whole teams. */
function openTeamsSheet(editPid) {
  const st = Engine.standings(T);            // team-shaped rows (player.id === team id)
  const byTeam = {};
  st.forEach(s => { byTeam[s.player.id] = s; });
  const skillsOn = T.config.useSkills;
  const activeCount = Engine.activeTeams(T).length;
  const teamRowHTML = (tm, ti) => {
    const players = tm.players.map(pid => T.players.find(x => x.id === pid));
    const active = players.every(p => p && p.active);
    const row = byTeam[tm.id];
    const stat = row ? `${Math.round(row.points)} ${scoreUnit(T.config)} · ${row.played} ${T.config.scoring === 'games' ? 'matches' : 'games'} · ${row.rests} rests` : '';
    const memberHTML = p => p.id === editPid
      ? `<div class="player-row"><span class="pnum">•</span><input id="pl-edit" value="${esc(p.name)}" autocomplete="off" enterkeyhint="done"><button class="del" id="pl-save" style="color:var(--lime)">✓</button></div>`
      : `<div class="player-row"><span class="pnum">•</span><div style="flex:1;min-width:0;font-weight:600">${esc(p.name)}</div>${skillsOn ? `<button class="skill-badge sk${p.skill || 2}" data-skp="${p.id}">${SKILL_GLYPH[p.skill || 2]}</button>` : ''}<button class="del" data-ed="${p.id}">✎</button></div>`;
    return `<div class="team-card" style="${active ? '' : 'opacity:.55'}">
      <div class="team-card-head">
        <span class="team-tag">Team ${ti + 1}${active ? '' : ' (left)'}</span>
        ${active
          ? (activeCount > 2 ? `<button class="del" data-rmteam="${tm.id}">✕</button>` : '')
          : `<button class="del" data-rjteam="${tm.id}" style="color:var(--lime);font-size:.9rem;width:auto;padding:0 12px">↩ rejoin</button>`}
      </div>
      ${players.map(memberHTML).join('')}
      <div class="pstat" style="padding:2px 6px 4px;color:var(--txt-faint);font-size:.78rem">${stat}</div>
    </div>`;
  };
  const ov = sheet(`
    <div class="grab"></div>
    <h3>Teams</h3>
    <div class="sub">Rename a player ✎, cycle skill, remove a whole team ✕ (results kept, can rejoin), or add a team below. Changes apply from the next draw.</div>
    <div class="proster">${T.teams.map(teamRowHTML).join('')}</div>
    <div class="team-card" style="margin-top:10px">
      <div class="team-card-head"><span class="team-tag">Add team</span></div>
      <div class="player-row"><span class="pnum">A</span><input id="np-a" placeholder="Player A" autocomplete="off"></div>
      <div class="player-row"><span class="pnum">B</span><input id="np-b" placeholder="Player B" autocomplete="off"><button class="del" id="np-add" style="color:var(--lime);font-size:1.5rem">+</button></div>
    </div>`);
  ov.querySelectorAll('[data-rmteam]').forEach(b => b.addEventListener('click', () => {
    const tm = T.teams.find(x => x.id === b.dataset.rmteam);
    confirmSheet(`Remove ${Engine.teamLabel(T, tm)}?`, 'They keep their points and can rejoin later from this list.', 'Remove', () => {
      mutate(() => Engine.removeTeam(T, tm.id));
      openTeamsSheet();
    });
  }));
  ov.querySelectorAll('[data-rjteam]').forEach(b => b.addEventListener('click', () => {
    const tm = T.teams.find(x => x.id === b.dataset.rjteam);
    mutate(() => Engine.reactivateTeam(T, tm.id));
    toast(Engine.teamLabel(T, tm) + ' rejoins from the next draw');
    openTeamsSheet();
  }));
  ov.querySelectorAll('[data-ed]').forEach(b => b.addEventListener('click', () => openTeamsSheet(b.dataset.ed)));
  ov.querySelectorAll('[data-skp]').forEach(b => b.addEventListener('click', () => {
    const p = T.players.find(x => x.id === b.dataset.skp);
    mutate(() => Engine.setSkill(T, p.id, nextSkill(p.skill || 2)));
    openTeamsSheet();
  }));
  const editInp = ov.querySelector('#pl-edit');
  if (editInp) {
    const commit = () => {
      const v = editInp.value.trim();
      const p = T.players.find(x => x.id === editPid);
      if (v && v !== p.name) {
        if (T.players.some(x => x.id !== editPid && x.name.toLowerCase() === v.toLowerCase())) { toast('Name already in use', true); return; }
        mutate(() => Engine.renamePlayer(T, editPid, v));
      }
      openTeamsSheet();
    };
    editInp.focus(); editInp.select();
    ov.querySelector('#pl-save').addEventListener('click', commit);
    editInp.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') openTeamsSheet(); });
  }
  ov.querySelector('#np-add').addEventListener('click', () => {
    const a = ov.querySelector('#np-a').value.trim(), b = ov.querySelector('#np-b').value.trim();
    if (!a || !b) { toast('Enter both players', true); return; }
    const lower = T.players.map(p => p.name.toLowerCase());
    if (lower.includes(a.toLowerCase()) || lower.includes(b.toLowerCase()) || a.toLowerCase() === b.toLowerCase()) { toast('Name already in use', true); return; }
    mutate(() => Engine.addTeam(T, [a, b]));
    toast(a + ' & ' + b + ' join from the next draw');
    openTeamsSheet();
  });
}

/**
 * After finishing the active round with latecomers still pending, prompt for arrivals before
 * the next round: optional before round 2 (tick people in → that round redraws, or continue),
 * mandatory at the cap before round 3. No-op for a full roster or when editing an earlier round.
 */
function arrivalsCheckpoint(roundIdx, prevIdx) {
  if (!Engine.pendingPlayers(T).length) return;          // full roster — nothing to ask
  if (roundIdx !== prevIdx) return;                       // editing an earlier round, not advancing
  if (!Engine.roundComplete(T, roundIdx)) return;         // round not actually finished yet
  if (roundIdx + 1 >= T.config.plannedRounds) return;     // no further round to play
  if (roundIdx + 1 >= Engine.PARTIAL_ROUND_CAP) openReadinessSheet({ gate: true });
  else openReadinessSheet({ inter: true, nextRoundNo: roundIdx + 2 });
}

/**
 * Readiness sheet — check late arrivals in (or remove no-shows). Modes via opts:
 *  - {inter, nextRoundNo}: before the next round (optional) — tick latecomers in (redraws that
 *    round) or continue with who's here. Auto-shown when a round finishes with people pending.
 *  - {gate}: mandatory before the round past PARTIAL_ROUND_CAP — everyone must be in or removed.
 *  - {redrawIdx}: re-draw that round after confirming who's arrived.
 *  - {} (manage): opened from the banner mid-round; just closes.
 */
function openReadinessSheet(opts) {
  opts = opts || {};
  const pend = Engine.pendingPlayers(T);
  const arrivedN = Engine.activePlayers(T).length;
  const isRedraw = typeof opts.redrawIdx === 'number';
  // gate (mandatory) is passed explicitly so its label/behaviour survive the last check-in
  // (which refills the schedule); inter (optional) is the after-round-1/before-round-2 prompt.
  const gate = !isRedraw && !!opts.gate;
  const inter = !isRedraw && !gate && !!opts.inter;
  const advancing = gate || inter;
  const nextRoundNo = gate ? (Engine.PARTIAL_ROUND_CAP + 1) : (opts.nextRoundNo || currentRoundIdx(T) + 1);
  const ov = sheet(`
    <div class="grab"></div>
    <h3>${pend.length ? 'Who has arrived?' : 'Everyone is here'}</h3>
    <div class="sub">${isRedraw
      ? 'Check in anyone who arrived, then re-draw the round to include them.'
      : gate
        ? (pend.length
          ? `Round ${nextRoundNo} needs the full group — check everyone in, or remove no-shows.`
          : `Everyone's in — continue to round ${nextRoundNo}.`)
        : inter
          ? (pend.length
            ? `Anyone arrived? Tick them in to join round ${nextRoundNo} (it'll be re-drawn), or continue with who's here.`
            : `Everyone's in — continue to round ${nextRoundNo}.`)
          : 'Tick players in as they arrive — they join the draw from the next round.'}</div>
    <div class="proster">
      ${pend.length ? pend.map(p => `
        <div class="player-row">
          <span class="pnum">🕒</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600">${esc(p.name)}</div>
            <div class="pstat">not checked in</div>
          </div>
          <button class="del" data-here="${p.id}" style="color:var(--lime);font-size:.9rem;width:auto;padding:0 12px">✓ here</button>
          <button class="del" data-noshow="${p.id}" title="Remove no-show">✕</button>
        </div>`).join('') : '<div class="setup-note">Everyone entered has checked in.</div>'}
    </div>
    <div class="setup-note" style="margin-top:10px">${arrivedN} checked in${pend.length ? ` · ${pend.length} waiting` : ''}</div>
    <div class="sheet-actions">
      ${isRedraw
        ? `<button class="btn btn-primary" id="rd-go" style="flex:2">⟲ Re-draw round ${opts.redrawIdx + 1}</button>`
        : advancing
          ? `<button class="btn btn-primary" id="rd-continue" style="flex:2" ${gate && pend.length ? 'disabled' : ''}>Continue to round ${nextRoundNo}</button>`
          : `<button class="btn btn-primary" id="rd-done" style="flex:2">Done</button>`}
    </div>`);
  ov.querySelectorAll('[data-here]').forEach(b => b.addEventListener('click', () => {
    const p = T.players.find(x => x.id === b.dataset.here);
    if (mutate(() => Engine.markArrived(T, p.id))) { opts._changed = true; toast(p.name + ' checked in'); }
    openReadinessSheet(opts);
  }));
  ov.querySelectorAll('[data-noshow]').forEach(b => b.addEventListener('click', () => {
    const p = T.players.find(x => x.id === b.dataset.noshow);
    confirmSheet(`Remove ${p.name}?`, 'They never checked in — this removes them from the tournament entirely.', 'Remove', () => {
      if (mutate(() => Engine.removeNoShow(T, p.id))) opts._changed = true;
      openReadinessSheet(opts);
    });
  }));
  const go = ov.querySelector('#rd-go');
  if (go) go.addEventListener('click', () => { closeSheet(); mutate(() => { Engine.regenerateRound(T, opts.redrawIdx); viewRound = opts.redrawIdx; }); });
  const advance = () => {
    closeSheet();
    // Fold the latecomers we just checked in into the upcoming round. markArrived froze
    // the current round defensively (the engine can't tell "about to play" from "just
    // played"), but this prompt only fires right after a round was scored, so the current
    // round is genuinely unplayed — an explicit re-draw here is safe and expected. Manual
    // "manage" mode isn't `advancing`, so a mid-round check-in never disturbs the match on
    // court. Only re-draw when the upcoming round is actually missing an active player
    // (the gate already refilled fresh provisional rounds that include everyone).
    if (advancing && opts._changed && T.config.format === 'americano') {
      const ci = currentRoundIdx(T);
      const inRound = new Set(T.rounds[ci].resting.concat(T.rounds[ci].matches.flatMap(m => m.teamA.concat(m.teamB))));
      if (!Engine.roundComplete(T, ci) && Engine.activePlayers(T).some(p => !inRound.has(p.id))) {
        mutate(() => Engine.regenerateRound(T, ci));
      }
    }
    // Mexicano draws lazily — draw the now-unblocked round; Americano already refilled on check-in
    if (T.config.format === 'mexicano' && T.rounds.every((_, i) => Engine.roundComplete(T, i)) && T.rounds.length < T.config.plannedRounds) {
      mutate(() => { Engine.generateRound(T); viewRound = T.rounds.length - 1; });
    } else {
      viewRound = currentRoundIdx(T);
      render();
    }
  };
  const cont = ov.querySelector('#rd-continue');
  if (cont) cont.addEventListener('click', advance);
  const done = ov.querySelector('#rd-done');
  if (done) done.addEventListener('click', advance);
}

function openHelpSheet() {
  sheet(`
    <div class="grab"></div>
    <h3>Rules &amp; help</h3>
    <div class="help-body">
      <p><b>Americano</b> — every round you get a new partner. A match is one long rally race: both teams' points add up to the match total (e.g. 14–10 in a 24-point match). You personally bank your team's score, win or lose. Highest individual total at the end wins.</p>
      <p><b>Team Americano (fixed pairs)</b> — pick this under Americano at setup when everyone brings a fixed partner. Each pair stays together all session and rotates opponents; whole teams sit out when there aren't enough courts. Standings, the podium and stats are all by <b>team</b>. Add or remove a whole team mid-session from Menu → Teams.</p>
      <p><b>Mixed Americano (two groups)</b> — pick this under Americano for classic mixed sessions: partners still rotate every round, but every pair is <b>one player from each group</b> (e.g. one man + one woman). Name the two groups at setup and enter each roster — groups need equal numbers to start, and everyone should be there at the start (no check-in screen). Sit-outs stay fair within each group; if someone leaves mid-session, the app fields as many courts as the smaller group allows. Standings stay individual.</p>
      <p><b>Mexicano</b> — round 1 is random; from round 2 the standings decide the draw: on each court, 1st+4th play 2nd+3rd of that group, so matches stay close.</p>
      <p><b>Serving</b> — one player serves <b>4 points in a row</b>, then the serve crosses to the other team. Partners take turns: each time the serve comes back to your team, the <em>other</em> partner serves. So a 24-point match goes: you serve 4 → opponent A serves 4 → your partner serves 4 → opponent B serves 4 → you again… until all points are played. Within your 4 serves, alternate service box (right, left, right, left) like normal padel. Who serves first? Spin a racket — it doesn't matter for the points. (If your group prefers 2-point serve turns, that's fine too — the app doesn't track serves.)</p>
      <p><b>Fair draws</b> — nobody sits out twice in a row, everyone's game count stays within ±1, and partners repeat only when mathematically unavoidable. Sit-out counts are shown next to resting players and in the standings.</p>
      <p><b>The schedule</b> — Americano draws every planned round upfront so you can see the whole evening. Rounds beyond the one being played are marked <b>provisional</b>: they redraw instantly if players, courts or skill badges change, and they can't be scored until it's their turn. Played scores are never touched. Mexicano draws each round only after the previous finishes — its pairings depend on the live standings.</p>
      <p><b>Sitting out</b> — earns nothing by default. Two compensation options (at setup, in Settings, or right on the standings — switch anytime, standings recompute instantly): <b>fixed</b> +half the match points per rest (neutral — resting neither costs nor pays), or <b>their avg</b> — each rest credits that player's own points-per-game, like ranking by average, so strong players keep their pace while resting.</p>
      <p><b>Rally points vs games</b> — pick your scoring at setup. <b>Rally points:</b> each match races to a combined total (e.g. 24) and the leaderboard adds up every point you bank. <b>Games (first to N):</b> each round is a mini-set played with normal 15·30·40 golden-point scoring — first to N games (usually 4) wins — and the leaderboard counts games won, not rally points. Enter the games score (e.g. 4–2) after each round. In Mexicano with games, early draws are coarser because game totals tie often; they settle as rounds add up.</p>
      <p><b>Scores</b> — tap any court card to enter or fix a score, in any round, anytime. Standings always recompute from the raw scores.</p>
      <p><b>Players</b> — Menu → Players to add, rename, remove or rejoin someone mid-session. Draws adapt from the next round; results already played are kept.</p>
      <p><b>Skill levels (optional)</b> — turn on at setup or in Settings, then give each player a badge: <b>+</b> stronger, <b>•</b> middle, <b>−</b> weaker — always relative to your group, not an official rating. Americano draws then avoid obviously lopsided matches (the two strongest never team up against the two weakest), while still rotating partners. A one-step gap is considered normal padel and stays allowed.</p>
      <p><b>Tie-breakers</b> — total points, then point difference, then wins. (Or wins first — see Settings.)</p>
      <p><b>Session timer</b> — the ⏳ chip in the header counts down the session length you picked at setup (tap it for details). Above an hour it shows h:mm; in the last hour it counts down minutes:seconds; after time it shows +overtime. The blinking dots are its heartbeat. It's just a guide — play as long as you like.</p>
      <p><b>Your data</b> — everything saves automatically in this browser. Use Menu → Export backup to move a tournament to another device or keep a record.</p>
    </div>`);
}

function exportBackup() {
  const data = JSON.stringify({ app: 'americano', v: 1, exportedAt: new Date().toISOString(), tournament: T });
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = `americano-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Backup downloaded');
}

function importBackup(file) {
  toast('Restoring…');
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      const t = obj && obj.tournament;
      if (!t || !Array.isArray(t.players) || !Array.isArray(t.rounds) || !t.config) {
        throw new Error('Not a valid Americano backup file');
      }
      T = t;
      store.saveCurrent(T);
      tab = 'rounds';
      viewRound = Math.max(0, T.rounds.length - 1);
      render();
      toast('Tournament restored');
    } catch (e) { toast(e.message, true); }
  };
  reader.onerror = () => toast('Could not read file', true);
  reader.readAsText(file);
}

/* Read-only replay of a finished, archived tournament. Operates purely on the
   stored snapshot — never touches the live tournament or localStorage. */
function openReplaySheet(entry) {
  if (!entry || !entry.snapshot) { toast('No replay saved for this one', true); return; }
  const snap = entry.snapshot;
  const playedRounds = snap.rounds.filter(r => Engine.anyScores(r));

  const ov = sheet(`
    <div class="grab"></div>

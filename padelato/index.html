<body>
<div id="js-warn" style="position:fixed;inset:0;z-index:999;background:#0b0e11;color:#e8edf2;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-family:-apple-system,sans-serif">
  <div style="max-width:34ch">
    <div class="splash-spin" style="width:38px;height:38px;border-radius:50%;margin:0 auto 18px;border:3px solid rgba(205,245,69,.2);border-top-color:#cdf545"></div>
    <b style="font-size:1.1rem">Loading Padelato…</b><br><br>
    <span style="color:#97a4b0;font-size:.88rem;line-height:1.5">Stuck on this screen? Then this viewer can't run apps (WhatsApp and iOS Files previews can't). Open the file in <b>Safari or Chrome</b> instead.</span>
  </div>
</div>
<div id="app"></div>
<div id="toast"></div>

<script>
/*ENGINE-START*/
/**
 * Americano/Mexicano padel tournament engine. Pure logic, no DOM.
 * The tournament object `t` is plain JSON (safe for localStorage).
 */
const Engine = (() => {
  'use strict';

  const uid = () => 'p' + Math.random().toString(36).slice(2, 9);
  const tid = () => 'tm' + Math.random().toString(36).slice(2, 9);

  function defaultRng() { return Math.random(); }

  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- creation ----------

  /** skill levels are relative to the group: 1 = weaker, 2 = middle, 3 = stronger */
  function clampSkill(v) { return v === 1 || v === 3 ? v : 2; }

  function createTournament(config) {
    const cfg = Object.assign({
      format: 'americano',          // 'americano' | 'mexicano'
      courts: 2,
      scoring: 'rally',             // 'rally' (rally points) | 'games' (first-to-N mini-sets)
      pointsPerMatch: 24,           // rally mode: combined points per match
      gamesTarget: 4,               // games mode: first to N games wins (scoreA/scoreB hold games won)
      scoreEntry: 'combined',       // rally mode: 'combined' | 'free'
      ranking: 'points',            // 'points' | 'wins'
      restMode: 'none',             // sit-out credit: 'none' | 'half' (fixed N/2) | 'avg' (player's own average)
      useSkills: false,             // balance Americano draws by player skill
      fixedPairs: false,            // fixed-partner Americano: the TEAM (a fixed pair) is the unit
      mixedGroups: false,           // mixed Americano: partners rotate but every pair is one A + one B
      plannedRounds: 8,
      courtNames: [],
      name: 'Americano',
    }, config || {});
    cfg.fixedPairs = !!cfg.fixedPairs;
    cfg.mixedGroups = !!cfg.mixedGroups;
    if (cfg.mixedGroups) {
      if (cfg.format !== 'americano') throw new Error('Mixed groups is Americano-only');
      if (cfg.fixedPairs) throw new Error('Mixed groups and fixed pairs cannot be combined');
      const gn = Array.isArray(cfg.groupNames) ? cfg.groupNames.map(x => String(x || '').trim()) : [];
      cfg.groupNames = [gn[0] || 'Group A', gn[1] || 'Group B'];
    }
    if (cfg.pointsPerMatch < 2) throw new Error('Points per match must be at least 2');

    // ---- fixed-pairs: partners are frozen for the whole session ----
    // Input `teams` is an array of two-player pairs (strings or {name,skill}). Players
    // still live in t.players (every one arrived+active); t.teams records the fixed pairs.
    if (cfg.fixedPairs) {
      const teamsIn = (config && config.teams || [])
        .map(team => (Array.isArray(team) ? team : (team && team.players) || [])
          .map(p => (p && typeof p === 'object')
            ? { name: String(p.name || '').trim(), skill: clampSkill(p.skill) }
            : { name: String(p).trim(), skill: 2 })
          .filter(p => p.name))
        .filter(pair => pair.length === 2);
      if (teamsIn.length < 2) throw new Error('Need at least 2 teams');
      const players = [], teams = [];
      for (const pair of teamsIn) {
        const tm = { id: tid(), players: [] };
        for (const p of pair) {
          const pl = { id: uid(), name: p.name, active: true, arrived: true, skill: p.skill };
          players.push(pl);
          tm.players.push(pl.id);
        }
        teams.push(tm);
      }
      delete cfg.teams; delete cfg.players;
      return {
        id: 't' + Date.now().toString(36),
        createdAt: config && config.createdAt || null,
        config: cfg, players, teams, rounds: [], finished: false,
      };
    }

    // players: array of strings, or {name, skill} objects when skill levels are used.
    // `arrived: false` marks a late-arriving player who is on the roster but not yet
    // checked in — kept off every draw and out of standings until they tick in.
    const roster = (config && config.players || [])
      .map(p => (p && typeof p === 'object')
        ? { name: String(p.name || '').trim(), skill: clampSkill(p.skill), arrived: p.arrived !== false, group: p.group }
        : { name: String(p).trim(), skill: 2, arrived: true })
      .filter(p => p.name);

    // ---- mixed groups: every pair will be one A + one B ----
    // Everyone is present at start (no late-arrival check-in in mixed mode) and the
    // groups must be the same size — mid-session imbalance is tolerated (court cap).
    if (cfg.mixedGroups) {
      for (const p of roster) {
        if (p.group !== 'A' && p.group !== 'B') throw new Error('Every player needs a group');
        p.arrived = true;
      }
      const nA = roster.filter(p => p.group === 'A').length, nB = roster.length - nA;
      if (nA !== nB) throw new Error(cfg.groupNames[0] + ' and ' + cfg.groupNames[1] + ' need the same number of players (' + nA + ' vs ' + nB + ')');
      if (nA < 2) throw new Error('Need at least 2 players per group');
    }

    if (roster.filter(p => p.arrived).length < 4) throw new Error('Need at least 4 players');

    const t = {
      id: 't' + Date.now().toString(36),
      createdAt: config && config.createdAt || null,
      config: cfg,
      players: roster.map(p => {
        const pl = { id: uid(), name: p.name, active: p.arrived, arrived: p.arrived, skill: p.skill };
        if (cfg.mixedGroups) pl.group = p.group;
        return pl;
      }),
      rounds: [],
      finished: false,
    };
    return t;
  }

  // ---------- derived state ----------

  function activePlayers(t) { return t.players.filter(p => p.active); }

  // ---- mixed groups derived state ----
  function activeByGroup(t) {
    const g = { A: [], B: [] };
    for (const p of t.players) if (p.active && (p.group === 'A' || p.group === 'B')) g[p.group].push(p);
    return g;
  }

  /** enough active units to draw a round? (players / per-group players / teams) */
  function canDraw(t) {
    if (t.config.fixedPairs) return activeTeams(t).length >= 2;
    if (t.config.mixedGroups) {
      const g = activeByGroup(t);
      return g.A.length >= 2 && g.B.length >= 2;
    }
    return activePlayers(t).length >= 4;
  }

  // ---- fixed-pairs (team) derived state ----
  // A team is active iff both its players are active (they always toggle together).
  function activeTeams(t) {
    if (!t.teams) return [];
    const act = new Set(t.players.filter(p => p.active).map(p => p.id));
    return t.teams.filter(tm => tm.players.every(pid => act.has(pid)));
  }
  function teamOf(t, pid) {
    if (!t.teams) return null;
    return t.teams.find(tm => tm.players.indexOf(pid) !== -1) || null;
  }
  function teamLabel(t, tm) { return tm.players.map(pid => playerName(t, pid)).join(' & '); }

  /** team-level history: how often each pair of teams faced, games played, whole-team rests */
  function teamHistory(t) {
    const teams = t.teams || [];
    const faced = {}, games = {}, rests = {};
    for (const tm of teams) { games[tm.id] = 0; rests[tm.id] = 0; }
    const owner = {};
    for (const tm of teams) for (const pid of tm.players) owner[pid] = tm.id;
    for (const r of t.rounds) {
      const restSet = new Set(r.resting);
      for (const tm of teams) if (tm.players.every(pid => restSet.has(pid))) rests[tm.id]++;
      for (const m of r.matches) {
        const A = owner[m.teamA[0]], B = owner[m.teamB[0]];
        if (A == null || B == null) continue;
        games[A]++; games[B]++;
        faced[pairKey(A, B)] = (faced[pairKey(A, B)] || 0) + 1;
      }
    }
    return { faced, games, rests, owner };
  }

  // Late-arrivals: a "pending" player is on the roster but not yet checked in
  // (arrived === false). While any pending player exists, the schedule is capped
  // at PARTIAL_ROUND_CAP rounds — everyone must check in or be removed to go further.
  const PARTIAL_ROUND_CAP = 2;
  function pendingPlayers(t) { return t.players.filter(p => p.arrived === false); }
  function roundCap(t) { return pendingPlayers(t).length ? PARTIAL_ROUND_CAP : Infinity; }

  function courtsUsed(t) {
    if (t.config.fixedPairs) {
      const nt = activeTeams(t).length;
      return Math.max(1, Math.min(t.config.courts, Math.floor(nt / 2)));
    }
    if (t.config.mixedGroups) {
      // each court needs exactly 2 A-players + 2 B-players, so the smaller group caps courts
      const g = activeByGroup(t);
      return Math.max(1, Math.min(t.config.courts, Math.floor(Math.min(g.A.length, g.B.length) / 2)));
    }
    const n = activePlayers(t).length;
    return Math.max(1, Math.min(t.config.courts, Math.floor(n / 4)));
  }

  function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  /** counts of partnered/opposed/rested derived from all generated rounds */
  function historyCounts(t) {
    const partner = {}, opponent = {}, rests = {}, games = {};
    for (const p of t.players) { rests[p.id] = 0; games[p.id] = 0; }
    for (const r of t.rounds) {
      for (const pid of r.resting) rests[pid] = (rests[pid] || 0) + 1;
      for (const m of r.matches) {
        const { teamA, teamB } = m;
        for (const pid of teamA.concat(teamB)) games[pid] = (games[pid] || 0) + 1;
        partner[pairKey(teamA[0], teamA[1])] = (partner[pairKey(teamA[0], teamA[1])] || 0) + 1;
        partner[pairKey(teamB[0], teamB[1])] = (partner[pairKey(teamB[0], teamB[1])] || 0) + 1;
        for (const a of teamA) for (const b of teamB) {
          opponent[pairKey(a, b)] = (opponent[pairKey(a, b)] || 0) + 1;
        }
      }
    }
    return { partner, opponent, rests, games };
  }

  // ---------- rest selection ----------

  function pickResters(t, rng) {
    const active = activePlayers(t);
    const cu = courtsUsed(t);
    const need = active.length - cu * 4;
    if (need <= 0) return [];

    const { rests, games } = historyCounts(t);
    const prev = t.rounds.length ? new Set(t.rounds[t.rounds.length - 1].resting) : new Set();

    // Hard-exclude last round's resters when enough other players remain.
    let pool = active.filter(p => !prev.has(p.id));
    if (pool.length < need) pool = active.slice();

    // Rest whoever has played the most. In a stable group this equals "fewest
    // rests first", but it also handles late joiners (0 games -> play, not rest).
    const jitter = new Map(pool.map(p => [p.id, rng()]));
    pool.sort((a, b) =>
      (games[b.id] - games[a.id]) ||
      (rests[a.id] - rests[b.id]) ||
      (jitter.get(a.id) - jitter.get(b.id)));
    return pool.slice(0, need).map(p => p.id);
  }

  /** Mixed groups: rest the excess from each group independently — same fairness
   *  rules per group (no consecutive sit-outs, most-games-first, score-independent)
   *  — so every court fields exactly two A-players and two B-players. */
  function pickRestersMixed(t, rng) {
    const cu = courtsUsed(t);
    const { rests, games } = historyCounts(t);
    const prev = t.rounds.length ? new Set(t.rounds[t.rounds.length - 1].resting) : new Set();
    const groups = activeByGroup(t);
    const out = [];
    for (const g of ['A', 'B']) {
      const active = groups[g];
      const need = active.length - cu * 2;
      if (need <= 0) continue;
      let pool = active.filter(p => !prev.has(p.id));
      if (pool.length < need) pool = active.slice();
      const jitter = new Map(pool.map(p => [p.id, rng()]));
      pool.sort((a, b) =>
        (games[b.id] - games[a.id]) ||
        (rests[a.id] - rests[b.id]) ||
        (jitter.get(a.id) - jitter.get(b.id)));
      for (const p of pool.slice(0, need)) out.push(p.id);
    }
    return out;
  }

  // ---------- pairing (americano) ----------

  /** all ways to split an even-sized id array into unordered pairs */
  function enumerateMatchings(ids) {
    if (ids.length === 0) return [[]];
    const [first, ...rest] = ids;
    const out = [];
    for (let i = 0; i < rest.length; i++) {
      const pair = [first, rest[i]];
      const remaining = rest.filter((_, k) => k !== i);
      for (const sub of enumerateMatchings(remaining)) out.push([pair, ...sub]);
    }
    return out;
  }

  function pairingCost(pairs, matchups, counts) {
    let cost = 0;
    for (const [a, b] of pairs) {
      const c = counts.partner[pairKey(a, b)] || 0;
      cost += 100 * c * c;
    }
    for (const [pa, pb] of matchups) {
      for (const a of pa) for (const b of pb) {
        const c = counts.opponent[pairKey(a, b)] || 0;
        cost += c * c;
      }
    }
    if (counts.useSkills) {
      // Penalize lopsided matchups: compare team skill sums. A 1-step gap is
      // normal padel; bigger gaps (e.g. the two strongest vs the two weakest,
      // diff 4) cost more than a repeated partner, so they are avoided first.
      for (const [pa, pb] of matchups) {
        const diff = Math.abs(
          counts.skill[pa[0]] + counts.skill[pa[1]] -
          counts.skill[pb[0]] - counts.skill[pb[1]]);
        const over = Math.max(0, diff - 1);
        cost += 40 * over * over;
      }
    }
    return cost;
  }

  /** all ways to group `pairs` (array of 2*k pairs) into k matches of two pairs */
  function enumeratePairMatchups(pairs) {
    if (pairs.length === 0) return [[]];
    const [first, ...rest] = pairs;
    const out = [];
    for (let i = 0; i < rest.length; i++) {
      const matchup = [first, rest[i]];
      const remaining = rest.filter((_, k) => k !== i);
      for (const sub of enumeratePairMatchups(remaining)) out.push([matchup, ...sub]);
    }
    return out;
  }

  function bestAmericanoMatches(t, ids, rng) {
    const counts = historyCounts(t);
    counts.useSkills = !!t.config.useSkills;
    counts.skill = {};
    for (const p of t.players) counts.skill[p.id] = p.skill || 2;

    if (ids.length <= 12) {
      // Exhaustive: <= 10395 matchings x <= 15 groupings.
      let best = null, bestCost = Infinity, ties = [];
      for (const pairs of enumerateMatchings(shuffle(ids, rng))) {
        for (const matchups of enumeratePairMatchups(pairs)) {
          const cost = pairingCost(pairs, matchups, counts);
          if (cost < bestCost) { bestCost = cost; ties = [matchups]; }
          else if (cost === bestCost) ties.push(matchups);
        }
      }
      best = ties[Math.floor(rng() * ties.length)];
      return best;
    }

    // Heuristic for very large courts-per-round: random restarts + swap hill climbing.
    // Early-exits on a perfect (zero-repeat) draw so big groups stay fast.
    let best = null, bestCost = Infinity;
    for (let iter = 0; iter < 40 && bestCost > 0; iter++) {
      const order = shuffle(ids, rng);
      const pairs = [];
      for (let i = 0; i < order.length; i += 2) pairs.push([order[i], order[i + 1]]);
      const matchups = [];
      for (let i = 0; i < pairs.length; i += 2) matchups.push([pairs[i], pairs[i + 1]]);
      let cost = pairingCost(pairs, matchups, counts);
      let improved = true;
      while (improved) {
        improved = false;
        const flat = matchups.flat(2); // player ids in position order
        for (let i = 0; i < flat.length; i++) {
          for (let j = i + 1; j < flat.length; j++) {
            [flat[i], flat[j]] = [flat[j], flat[i]];
            const cand = [];
            for (let k = 0; k < flat.length; k += 4) {
              cand.push([[flat[k], flat[k + 1]], [flat[k + 2], flat[k + 3]]]);
            }
            const cPairs = cand.flatMap(m => m);
            const cCost = pairingCost(cPairs, cand, counts);
            if (cCost < cost) { cost = cCost; improved = true; }
            else [flat[i], flat[j]] = [flat[j], flat[i]];
          }
        }
        if (improved) {
          const rebuilt = [];
          for (let k = 0; k < flat.length; k += 4) {
            rebuilt.push([[flat[k], flat[k + 1]], [flat[k + 2], flat[k + 3]]]);
          }
          matchups.length = 0;
          matchups.push(...rebuilt);
        }
      }
      if (cost < bestCost) { bestCost = cost; best = matchups.map(m => [m[0].slice(), m[1].slice()]); }
    }
    return best;
  }

  // ---------- pairing (mixed groups) ----------

  /** all orderings of an array (used for bipartite matchings; n <= 6 here) */
  function permutations(arr) {
    if (arr.length <= 1) return [arr.slice()];
    const out = [];
    for (let i = 0; i < arr.length; i++) {
      const rest = arr.slice(0, i).concat(arr.slice(i + 1));
      for (const sub of permutations(rest)) out.push([arr[i]].concat(sub));
    }
    return out;
  }

  /** Mixed groups: every pair must be one A + one B. The search space itself is
   *  bipartite (B-side permutations over the A side) — a HARD constraint; a
   *  same-group pair is unrepresentable, never merely expensive. The cost
   *  function (partner repeats, opponent variety, skill) is classic's, untouched. */
  function bestMixedMatches(t, ids, rng) {
    const counts = historyCounts(t);
    counts.useSkills = !!t.config.useSkills;
    counts.skill = {};
    for (const p of t.players) counts.skill[p.id] = p.skill || 2;
    const gOf = {};
    for (const p of t.players) gOf[p.id] = p.group;
    const A = shuffle(ids.filter(id => gOf[id] === 'A'), rng);
    const B = shuffle(ids.filter(id => gOf[id] === 'B'), rng);

    if (ids.length <= 12) {
      // Exhaustive: <= 6! = 720 matchings x <= 15 groupings — cheaper than classic's 10395.
      let bestCost = Infinity, ties = [];
      for (const perm of permutations(B)) {
        const pairs = A.map((a, i) => [a, perm[i]]);
        for (const matchups of enumeratePairMatchups(pairs)) {
          const cost = pairingCost(pairs, matchups, counts);
          if (cost < bestCost) { bestCost = cost; ties = [matchups]; }
          else if (cost === bestCost) ties.push(matchups);
        }
      }
      return ties[Math.floor(rng() * ties.length)];
    }

    // Heuristic for very large courts-per-round: classic's restarts + hill climbing,
    // but swaps stay within one group — flat slots alternate A,B,A,B…, so only
    // same-parity swaps are tried and every candidate remains bipartite.
    let best = null, bestCost = Infinity;
    for (let iter = 0; iter < 40 && bestCost > 0; iter++) {
      const a = shuffle(A, rng), b = shuffle(B, rng);
      const pairs = a.map((x, i) => [x, b[i]]);
      const matchups = [];
      for (let i = 0; i < pairs.length; i += 2) matchups.push([pairs[i], pairs[i + 1]]);
      let cost = pairingCost(pairs, matchups, counts);
      let improved = true;
      while (improved) {
        improved = false;
        const flat = matchups.flat(2); // slots: A,B,A,B,… in position order
        for (let i = 0; i < flat.length; i++) {
          for (let j = i + 1; j < flat.length; j++) {
            if ((i & 1) !== (j & 1)) continue; // same-group slots only
            [flat[i], flat[j]] = [flat[j], flat[i]];
            const cand = [];
            for (let k = 0; k < flat.length; k += 4) {
              cand.push([[flat[k], flat[k + 1]], [flat[k + 2], flat[k + 3]]]);
            }
            const cPairs = cand.flatMap(m => m);
            const cCost = pairingCost(cPairs, cand, counts);
            if (cCost < cost) { cost = cCost; improved = true; }
            else [flat[i], flat[j]] = [flat[j], flat[i]];
          }
        }
        if (improved) {
          const rebuilt = [];
          for (let k = 0; k < flat.length; k += 4) {
            rebuilt.push([[flat[k], flat[k + 1]], [flat[k + 2], flat[k + 3]]]);
          }
          matchups.length = 0;
          matchups.push(...rebuilt);
        }
      }
      if (cost < bestCost) { bestCost = cost; best = matchups.map(m => [m[0].slice(), m[1].slice()]); }
    }
    return best;
  }

  // ---------- pairing (fixed pairs / teams) ----------
  // Partners are frozen; the matcher only chooses which whole teams sit out and which
  // teams face which. Mirrors the individual rest/match logic at team granularity.

  function pickRestingTeams(t, rng) {
    const teams = activeTeams(t);
    const cu = courtsUsed(t);
    const need = teams.length - cu * 2;
    if (need <= 0) return [];
    const { games, rests } = teamHistory(t);
    // hard-exclude last round's resting teams when enough others remain
    const prevRest = new Set();
    if (t.rounds.length) {
      const restSet = new Set(t.rounds[t.rounds.length - 1].resting);
      for (const tm of (t.teams || [])) if (tm.players.every(pid => restSet.has(pid))) prevRest.add(tm.id);
    }
    let pool = teams.filter(tm => !prevRest.has(tm.id));
    if (pool.length < need) pool = teams.slice();
    const jitter = new Map(pool.map(tm => [tm.id, rng()]));
    pool.sort((a, b) =>
      ((games[b.id] || 0) - (games[a.id] || 0)) ||
      ((rests[a.id] || 0) - (rests[b.id] || 0)) ||
      (jitter.get(a.id) - jitter.get(b.id)));
    return pool.slice(0, need);
  }

  /** Group the playing teams into matches, minimizing team-vs-team rematches (then skill). */
  function bestTeamMatchups(t, teams, rng) {
    const { faced } = teamHistory(t);
    const useSkills = !!t.config.useSkills;
    const skillSum = {};
    if (useSkills) {
      const sk = {}; for (const p of t.players) sk[p.id] = p.skill || 2;
      for (const tm of (t.teams || [])) skillSum[tm.id] = (sk[tm.players[0]] || 2) + (sk[tm.players[1]] || 2);
    }
    const cost = (matchups) => {
      let c = 0;
      for (const [x, y] of matchups) {
        const f = faced[pairKey(x.id, y.id)] || 0;
        c += 1000 * f * f;                    // rematch weight dominates skill (see CLAUDE.md)
        if (useSkills) {
          const over = Math.max(0, Math.abs(skillSum[x.id] - skillSum[y.id]) - 1);
          c += 40 * over * over;
        }
      }
      return c;
    };
    const order = shuffle(teams, rng);        // <= 12 playing teams → exhaustive is cheap
    let bestCost = Infinity, ties = [];
    for (const matchups of enumeratePairMatchups(order)) {
      const cc = cost(matchups);
      if (cc < bestCost) { bestCost = cc; ties = [matchups]; }
      else if (cc === bestCost) ties.push(matchups);
    }
    const best = ties[Math.floor(rng() * ties.length)];
    return best.map(([x, y]) => [x.players.slice(), y.players.slice()]);
  }

  // ---------- pairing (mexicano) ----------

  function mexicanoMatches(t, ids) {
    // Sort the active (non-resting) players by current standings; group 4 per court:
    // within each group, 1st+4th vs 2nd+3rd.
    const rank = standings(t).map(s => s.player.id);
    const pos = new Map(rank.map((id, i) => [id, i]));
    const sorted = ids.slice().sort((a, b) => pos.get(a) - pos.get(b));
    const matchups = [];
    for (let i = 0; i < sorted.length; i += 4) {
      const g = sorted.slice(i, i + 4);
      matchups.push([[g[0], g[3]], [g[1], g[2]]]);
    }
    return matchups;
  }

  // ---------- round generation ----------

  function anyScores(round) {
    return round.matches.some(m => m.scoreA !== null || m.scoreB !== null);
  }

  function generateRound(t, rng) {
    rng = rng || defaultRng;

    // fixed-pairs: rest whole teams, then match the playing teams against each other
    if (t.config.fixedPairs) {
      if (activeTeams(t).length < 2) throw new Error('Need at least 2 active teams');
      const restTeams = pickRestingTeams(t, rng);
      const restIds = new Set(restTeams.map(tm => tm.id));
      const resting = restTeams.flatMap(tm => tm.players.slice());
      const playing = activeTeams(t).filter(tm => !restIds.has(tm.id));
      const matchups = bestTeamMatchups(t, playing, rng);
      const round = {
        matches: matchups.map((m, i) => ({ court: i, teamA: m[0], teamB: m[1], scoreA: null, scoreB: null })),
        resting,
      };
      t.rounds.push(round);
      return round;
    }

    if (activePlayers(t).length < 4) throw new Error('Need at least 4 active players');
    if (t.config.mixedGroups && !canDraw(t)) throw new Error('Need at least 2 active players per group');
    if (t.rounds.length >= PARTIAL_ROUND_CAP && pendingPlayers(t).length) {
      throw new Error('Check everyone in or remove no-shows before round ' + (PARTIAL_ROUND_CAP + 1));
    }

    const resting = t.config.mixedGroups ? pickRestersMixed(t, rng) : pickResters(t, rng);
    const restSet = new Set(resting);
    const ids = shuffle(activePlayers(t).filter(p => !restSet.has(p.id)).map(p => p.id), rng);

    const useMexicano = t.config.format === 'mexicano' && t.rounds.some(anyScores);
    const matchups = t.config.mixedGroups
      ? bestMixedMatches(t, ids, rng)
      : useMexicano ? mexicanoMatches(t, ids) : bestAmericanoMatches(t, ids, rng);

    const round = {
      matches: matchups.map((m, i) => ({
        court: i,
        teamA: m[0], teamB: m[1],
        scoreA: null, scoreB: null,
      })),
      resting,
    };
    t.rounds.push(round);
    return round;
  }

  /** total partner-pair repeats across the whole schedule (times-together beyond the first). */
  function partnerRepeatTotal(t) {
    const { partner } = historyCounts(t);
    let extra = 0;
    for (const k in partner) if (partner[k] > 1) extra += partner[k] - 1;
    return extra;
  }

  /** Provable lower bound on partner repeats for a drawn mixed schedule. An
   *  A-player with g games has at most |B roster| distinct partners, so must
   *  re-use at least g − nB pairs; every pair holds exactly one A-player, so the
   *  A-side sum equals total repeats exactly (symmetrically for B). Loose (0)
   *  for sit-out configs — its job is stopping best-of-N when a try provably
   *  can't be beaten (e.g. 6v6/3ct past the Latin limit always bottoms at 12;
   *  without this exit every try burns and the refill takes ~23s). */
  function mixedRepeatFloor(t) {
    const { games } = historyCounts(t);
    let nA = 0, nB = 0;
    for (const p of t.players) { if (p.group === 'A') nA++; else if (p.group === 'B') nB++; }
    let fA = 0, fB = 0;
    for (const p of t.players) {
      const g = games[p.id] || 0;
      if (p.group === 'A') fA += Math.max(0, g - nB);
      else if (p.group === 'B') fB += Math.max(0, g - nA);
    }
    return Math.max(fA, fB);
  }

  /** schedule-quality metric for best-of-N: partner repeats (individual) or
   *  team-vs-team rematches (fixed pairs) — the axis the matcher rotates on. */
  function scheduleRepeats(t) {
    if (t.config.fixedPairs) {
      const { faced } = teamHistory(t);
      let extra = 0;
      for (const k in faced) if (faced[k] > 1) extra += faced[k] - 1;
      return extra;
    }
    return partnerRepeatTotal(t);
  }

  // The per-round matcher already minimizes repeats against history, but it's greedy
  // (no lookahead), so an early round can force an avoidable repeat several rounds later
  // — worst with odd/sit-out counts. Drawing the provisional tail a few times and keeping
  // the fewest-repeat variant finds a clean schedule (a no-repeat one almost always exists).
  // Tries are cheap: a clean draw stops the loop early, so only the rare tight small-group
  // cases ever iterate; large groups are repeat-free on the first try.
  const REFILL_TRIES = 40;
  // Mixed groups constrain pairing hard (6v6/2ct: only ~8% of single draws are
  // repeat-free vs ~100% classic), so best-of-N needs more tries where rounds
  // are cheap: with <=8 playing a round costs <=24x3 cost evals, so 160 tries
  // are ~free and put the 6v6/2ct miss odds at ~1e-6. At 12 playing a round is
  // the 720x15 exhaustive (~20ms) — there we keep classic's 40-try budget so a
  // refill can never burn multi-seconds when the floor/clean exits don't fire
  // (e.g. after roster churn leaves the repeat floor unreachable). 12-playing
  // quality holds anyway: 6v6/3ct floor-exits, 8v8/3ct is ~100% clean on the
  // first try, 7v7/3ct misses in ~0.4% of draws (one extra repeat, documented).
  const MIXED_REFILL_TRIES = 160;

  /** Americano: draw every planned round upfront (rounds beyond the current are provisional). */
  function refillPlanned(t, rng) {
    if (t.config.format !== 'americano') return;
    const cap = Math.min(t.config.plannedRounds, roundCap(t));
    const prefix = t.rounds;                       // played + current rounds — kept verbatim
    const enough = () => canDraw(t);
    if (prefix.length >= cap || !enough()) return;
    let best = null, bestRep = Infinity;
    const tries = t.config.mixedGroups && courtsUsed(t) * 4 <= 8 ? MIXED_REFILL_TRIES : REFILL_TRIES;
    for (let k = 0; k < tries; k++) {
      t.rounds = prefix.slice();                    // restart from the kept prefix each try
      while (t.rounds.length < cap && enough()) generateRound(t, rng);
      const rep = scheduleRepeats(t);
      if (rep < bestRep) { bestRep = rep; best = t.rounds; }
      if (rep === 0) break;                         // a clean schedule — stop early
      if (t.config.mixedGroups && rep <= mixedRepeatFloor(t)) break; // provably optimal — stop
    }
    t.rounds = best;
  }

  /**
   * Redraw the provisional rounds after a change to roster, courts or skills.
   * The round being played (first incomplete) and every earlier round are FROZEN —
   * a match already on court must never change under the players' feet, even before
   * its score is entered. A played-but-unscored round is indistinguishable from a
   * never-played provisional one, so we err on the side of never touching the
   * current round; only rounds strictly after it are dropped and redrawn. To fold a
   * change into the current round on purpose, use regenerateRound (the explicit
   * "re-draw round" action / the post-round arrivals prompt). No-op before start.
   */
  function redrawFuture(t, rng) {
    if (!t.rounds.length) return;
    let cur = t.rounds.findIndex((_, i) => !roundComplete(t, i));
    if (cur === -1) cur = t.rounds.length - 1;     // all complete → last round is current
    while (t.rounds.length - 1 > cur) t.rounds.pop();
    if (!canDraw(t)) return;
    if (t.config.format === 'americano') refillPlanned(t, rng);
    // mexicano draws its next round lazily (on advance), so nothing to regenerate here.
  }

  /** Change the planned round count; trims/refills provisional rounds (Americano). */
  function setPlannedRounds(t, n, rng) {
    n = Math.max(1, Math.floor(Number(n) || 0));
    // Drop the ENTIRE provisional tail (everything after the round on court), then let
    // refillPlanned redraw it best-of-N for the new length. Keyed on roundComplete, not
    // anyScores, so the played-but-unscored round on court is never deleted. Redrawing the
    // whole tail (not just appended rounds) means growing the plan can't strand an earlier
    // provisional round into an avoidable partner repeat.
    let cur = t.rounds.findIndex((_, i) => !roundComplete(t, i));
    if (cur === -1) cur = t.rounds.length - 1;
    while (t.rounds.length - 1 > cur) t.rounds.pop();
    n = Math.max(n, t.rounds.length); // can never plan below the round on court
    t.config.plannedRounds = n;
    refillPlanned(t, rng);
    return n;
  }

  /** Re-draw from round `idx` onward. Allowed only when those rounds have no scores. */
  function regenerateRound(t, idx, rng) {
    if (idx < 0 || idx >= t.rounds.length) throw new Error('No such round');
    for (let i = idx; i < t.rounds.length; i++) {
      if (anyScores(t.rounds[i])) throw new Error('Cannot re-draw rounds that have scores');
    }
    t.rounds.length = idx;
    if (t.config.format === 'americano') refillPlanned(t, rng);
    else generateRound(t, rng);
    return t.rounds[idx];
  }

  // ---------- ruled redraws (host redraw options) ----------

  /** ids sorted by live standings position, best first (rank compressed over `ids`). */
  function rankOrder(t, ids) {
    const pos = new Map(standings(t).map((s, i) => [s.player.id, i]));
    return ids.slice().sort((a, b) =>
      (pos.has(a) ? pos.get(a) : Infinity) - (pos.has(b) ? pos.get(b) : Infinity));
  }

  /** Group ruled pairs into matches with the fewest opponent rematches — any grouping
   *  is rank-fair for Balancer/Seesaw (all pairs share the same rank-sum) — then order
   *  courts so the best-ranked player plays court 1. Past 12 pairs the grouping
   *  enumeration explodes ((2c-1)!!), so fall back to adjacent-by-rank grouping. */
  function ruledMatchups(t, pairs, rng) {
    let groupings;
    if (pairs.length > 12) {
      const g = [];
      for (let i = 0; i < pairs.length; i += 2) g.push([pairs[i], pairs[i + 1]]);
      groupings = [g];
    } else {
      groupings = enumeratePairMatchups(pairs);
    }
    const { opponent } = historyCounts(t);
    let bestCost = Infinity, ties = [];
    for (const matchups of groupings) {
      let cost = 0;
      for (const [pa, pb] of matchups) {
        for (const a of pa) for (const b of pb) {
          const c = opponent[pairKey(a, b)] || 0;
          cost += c * c;
        }
      }
      if (cost < bestCost) { bestCost = cost; ties = [matchups]; }
      else if (cost === bestCost) ties.push(matchups);
    }
    const best = ties[Math.floor(rng() * ties.length)];
    const pos = new Map(rankOrder(t, pairs.flat()).map((id, i) => [id, i]));
    const matchRank = m => Math.min(pos.get(m[0][0]), pos.get(m[0][1]), pos.get(m[1][0]), pos.get(m[1][1]));
    return best.slice().sort((x, y) => matchRank(x) - matchRank(y));
  }

  /** playing ids split by group, each list ranked best-first (mixed rules). */
  function rankedByGroup(t, ids) {
    const ranked = rankOrder(t, ids);
    const grp = {};
    for (const p of t.players) grp[p.id] = p.group;
    return { A: ranked.filter(id => grp[id] === 'A'), B: ranked.filter(id => grp[id] === 'B') };
  }

  function mixedRuledAvailable(t) {
    return t.config.format === 'americano' && t.config.mixedGroups && !t.config.fixedPairs
      && t.rounds.some(anyScores);
  }
  function classicRuledAvailable(t) {
    return t.config.format === 'americano' && !t.config.mixedGroups && !t.config.fixedPairs
      && t.rounds.some(anyScores);
  }

  /** One-shot host redraw rules. Rank-based: they read the live standings at the moment
   *  of redraw, compressed over the players who actually play. Adding a rule = one entry
   *  here; availableFor gates by mode (fixed pairs and Mexicano get none) and requires
   *  at least one score (ranks are meaningless at 0-0). */
  const REDRAW_RULES = [
    {
      id: 'balancer', label: 'Balancer',
      blurb: t => {
        const gn = t.config.groupNames || ['Group A', 'Group B'];
        return 'Best of ' + gn[0] + ' pairs with last of ' + gn[1] + ', and so on — every pair has the same combined rank, so matches stay close.';
      },
      availableFor: mixedRuledAvailable,
      draw: (t, playing, rng) => {
        const g = rankedByGroup(t, playing);
        const pairs = g.A.map((a, i) => [a, g.B[g.B.length - 1 - i]]);
        return ruledMatchups(t, pairs, rng);
      },
    },
    {
      id: 'dream', label: 'Dream teams',
      blurb: t => {
        const gn = t.config.groupNames || ['Group A', 'Group B'];
        return '#1 of ' + gn[0] + ' pairs with #1 of ' + gn[1] + ', and so on — strongest pairs face each other, showdown on court 1.';
      },
      availableFor: mixedRuledAvailable,
      draw: (t, playing) => {
        const g = rankedByGroup(t, playing);
        const pairs = g.A.map((a, i) => [a, g.B[i]]);
        const matchups = [];
        for (let i = 0; i < pairs.length; i += 2) matchups.push([pairs[i], pairs[i + 1]]);
        return matchups;
      },
    },
    {
      id: 'seesaw', label: 'Seesaw',
      blurb: () => '#1 pairs with last place, #2 with second-last, and so on — every pair has the same combined rank, so matches stay close.',
      availableFor: classicRuledAvailable,
      draw: (t, playing, rng) => {
        const ranked = rankOrder(t, playing);
        const pairs = [];
        for (let i = 0; i < ranked.length / 2; i++) pairs.push([ranked[i], ranked[ranked.length - 1 - i]]);
        return ruledMatchups(t, pairs, rng);
      },
    },
    {
      id: 'mexicanoRound', label: 'Mexicano round',
      blurb: () => 'One Mexicano-style round: by rank in groups of four — 1st & 4th vs 2nd & 3rd. Court 1 hosts the top four.',
      availableFor: classicRuledAvailable,
      draw: (t, playing) => mexicanoMatches(t, playing),
    },
  ];

  /** Rules currently offerable to the host (empty ⇒ the UI hides the options button). */
  function redrawRules(t) {
    return REDRAW_RULES.filter(r => r.availableFor(t))
      .map(r => ({ id: r.id, label: r.label, blurb: r.blurb(t) }));
  }

  /**
   * Host redraw of the CURRENT round by a named rule. One-shot: only round `idx` is
   * ruled; the provisional tail refills with the normal best-of-N logic, and the ruled
   * pairs feed historyCounts so later draws avoid re-pairing them. Current-round-only
   * by design — a ruled draw of a future provisional round would rank on stale
   * standings and be silently destroyed by any roster change. Sit-out selection is
   * reused verbatim (rest fairness stays score-independent); skill badges are ignored
   * (rank replaces skill for this one round).
   */
  function regenerateRoundRuled(t, idx, ruleId, rng) {
    rng = rng || defaultRng;
    const rule = REDRAW_RULES.find(r => r.id === ruleId);
    if (!rule || !rule.availableFor(t)) throw new Error('Rule not available: ' + ruleId);
    if (idx < 0 || idx >= t.rounds.length) throw new Error('No such round');
    let cur = t.rounds.findIndex((_, i) => !roundComplete(t, i));
    if (cur === -1) cur = t.rounds.length - 1;
    if (idx !== cur) throw new Error('Ruled re-draws apply to the current round only');
    for (let i = idx; i < t.rounds.length; i++) {
      if (anyScores(t.rounds[i])) throw new Error('Cannot re-draw rounds that have scores');
    }
    t.rounds.length = idx;
    const resting = t.config.mixedGroups ? pickRestersMixed(t, rng) : pickResters(t, rng);
    const restSet = new Set(resting);
    const playing = activePlayers(t).filter(p => !restSet.has(p.id)).map(p => p.id);
    const matchups = rule.draw(t, playing, rng);
    t.rounds.push({
      matches: matchups.map((m, i) => ({ court: i, teamA: m[0], teamB: m[1], scoreA: null, scoreB: null })),
      resting,
    });
    refillPlanned(t, rng);
    return t.rounds[idx];
  }

  // ---------- scoring ----------

  function setScore(t, roundIdx, matchIdx, scoreA, scoreB) {
    // only the current round (and corrections to finished ones) can be scored —
    // future provisional rounds may still be redrawn, so their scores are locked
    for (let i = 0; i < roundIdx; i++) {
      if (!roundComplete(t, i)) throw new Error('Finish round ' + (i + 1) + ' first');
    }
    const m = t.rounds[roundIdx].matches[matchIdx];
    const a = Number(scoreA), b = Number(scoreB);
    if (!Number.isInteger(a) || !Number.isInteger(b) || a < 0 || b < 0) {
      throw new Error('Scores must be non-negative whole numbers');
    }
    if (t.config.scoring === 'games') {
      // strict first-to-N: exactly one side reaches the target, the other is below it
      const N = t.config.gamesTarget || 4;
      if (Math.max(a, b) !== N || Math.min(a, b) >= N) {
        throw new Error('First to ' + N + ' games — the winner needs exactly ' + N);
      }
    } else if (t.config.scoreEntry === 'combined' && a + b !== t.config.pointsPerMatch) {
      throw new Error('Scores must add up to ' + t.config.pointsPerMatch);
    }
    m.scoreA = a;
    m.scoreB = b;
  }

  function clearScore(t, roundIdx, matchIdx) {
    const m = t.rounds[roundIdx].matches[matchIdx];
    m.scoreA = null;
    m.scoreB = null;
  }

  function roundComplete(t, idx) {
    const r = t.rounds[idx];
    return r.matches.every(m => m.scoreA !== null && m.scoreB !== null);
  }

  // ---------- standings ----------

  function standings(t) {
    // fixed-pairs: delegate to team standings, reshaped into the same row shape the UI
    // consumes (row.player.{id,name,active}) so every renderer works without branching.
    if (t.config.fixedPairs) {
      const act = new Set(t.players.filter(p => p.active).map(p => p.id));
      return teamStandings(t).map(r => ({
        player: { id: r.team.id, name: r.name, active: r.team.players.every(pid => act.has(pid)) },
        points: r.points, played: r.played, wins: r.wins, draws: r.draws, losses: r.losses,
        pf: r.pf, pa: r.pa, diff: r.diff, rests: r.rests,
      }));
    }
    const stats = {};
    for (const p of t.players) {
      if (p.arrived === false) continue; // not yet checked in — no row until they play
      stats[p.id] = { player: p, points: 0, played: 0, wins: 0, draws: 0, losses: 0, pf: 0, pa: 0, diff: 0, rests: 0 };
    }
    // Rests only count up to the round being played — Americano pre-draws the
    // full schedule, and provisional future rests must not show up in the Rest
    // column or earn compensation early. (Matches v15 lazily-drawn semantics.)
    let reached = t.rounds.findIndex((_, i) => !roundComplete(t, i));
    if (reached === -1) reached = t.rounds.length - 1;
    for (let ri = 0; ri < t.rounds.length; ri++) {
      const r = t.rounds[ri];
      if (ri <= reached) for (const pid of r.resting) if (stats[pid]) stats[pid].rests++;
      for (const m of r.matches) {
        if (m.scoreA === null || m.scoreB === null) continue;
        const apply = (team, mine, theirs) => {
          for (const pid of team) {
            const s = stats[pid];
            if (!s) continue;
            s.points += mine;
            s.pf += mine;
            s.pa += theirs;
            s.played++;
            if (mine > theirs) s.wins++;
            else if (mine === theirs) s.draws++;
            else s.losses++;
          }
        };
        apply(m.teamA, m.scoreA, m.scoreB);
        apply(m.teamB, m.scoreB, m.scoreA);
      }
    }
    const rows = Object.values(stats);
    // sit-out credit: 'half' = fixed half the match total (neutral in expectation);
    // 'avg' = the player's own points-per-game so far (equivalent to ranking by
    // average when games are uneven; falls back to half before their first game).
    // legacy tournaments stored a restPoints number — treat >0 as 'half'.
    const mode = (t.config.restMode && t.config.restMode !== 'none')
      ? t.config.restMode
      : (t.config.restPoints > 0 ? 'half' : 'none');
    // 'half' base = half a match's worth: half the rally total, or half the games target
    const half = t.config.scoring === 'games'
      ? (t.config.gamesTarget || 4) / 2
      : Math.floor((t.config.pointsPerMatch || 24) / 2);
    for (const s of rows) {
      s.diff = s.pf - s.pa;
      if (mode === 'half') s.points += s.rests * half;
      else if (mode === 'avg') s.points += s.rests * (s.played ? s.pf / s.played : half);
    }
    const byPoints = (x, y) =>
      (y.points - x.points) || (y.diff - x.diff) || (y.wins - x.wins) ||
      x.player.name.localeCompare(y.player.name);
    const byWins = (x, y) =>
      (y.wins - x.wins) || (y.points - x.points) || (y.diff - x.diff) ||
      x.player.name.localeCompare(y.player.name);
    rows.sort(t.config.ranking === 'wins' ? byWins : byPoints);
    return rows;
  }

  /** Standings aggregated by team (fixed-pairs mode). One row per team; both members
   *  always have identical stats, so the team IS the row. Same rest-compensation modes. */
  function teamStandings(t) {
    const teams = t.teams || [];
    const stats = {};
    for (const tm of teams) {
      stats[tm.id] = { team: tm, name: teamLabel(t, tm), points: 0, played: 0, wins: 0, draws: 0, losses: 0, pf: 0, pa: 0, diff: 0, rests: 0 };
    }
    const owner = {};
    for (const tm of teams) for (const pid of tm.players) owner[pid] = tm.id;
    let reached = t.rounds.findIndex((_, i) => !roundComplete(t, i));
    if (reached === -1) reached = t.rounds.length - 1;
    for (let ri = 0; ri < t.rounds.length; ri++) {
      const r = t.rounds[ri];
      if (ri <= reached) {
        const restSet = new Set(r.resting);
        for (const tm of teams) if (tm.players.every(pid => restSet.has(pid)) && stats[tm.id]) stats[tm.id].rests++;
      }
      for (const m of r.matches) {
        if (m.scoreA === null || m.scoreB === null) continue;
        const A = owner[m.teamA[0]], B = owner[m.teamB[0]];
        const apply = (id, mine, theirs) => {
          const s = stats[id];
          if (!s) return;
          s.points += mine; s.pf += mine; s.pa += theirs; s.played++;
          if (mine > theirs) s.wins++; else if (mine === theirs) s.draws++; else s.losses++;
        };
        apply(A, m.scoreA, m.scoreB);
        apply(B, m.scoreB, m.scoreA);
      }
    }
    const rows = Object.values(stats);
    const mode = (t.config.restMode && t.config.restMode !== 'none')
      ? t.config.restMode
      : (t.config.restPoints > 0 ? 'half' : 'none');
    const half = t.config.scoring === 'games'
      ? (t.config.gamesTarget || 4) / 2
      : Math.floor((t.config.pointsPerMatch || 24) / 2);
    for (const s of rows) {
      s.diff = s.pf - s.pa;
      if (mode === 'half') s.points += s.rests * half;
      else if (mode === 'avg') s.points += s.rests * (s.played ? s.pf / s.played : half);
    }
    const byPoints = (x, y) =>
      (y.points - x.points) || (y.diff - x.diff) || (y.wins - x.wins) || x.name.localeCompare(y.name);
    const byWins = (x, y) =>
      (y.wins - x.wins) || (y.points - x.points) || (y.diff - x.diff) || x.name.localeCompare(y.name);
    rows.sort(t.config.ranking === 'wins' ? byWins : byPoints);
    return rows;
  }

  // ---------- score views (read-only analytics) ----------

  /**
   * Standings after each scored round — the rank/points timeline behind the
   * bump chart and climber stats. Returns one entry per round that has any
   * score, in round order: { round (1-based), order:[pid…best→worst],
   * rank:{pid:index}, points:{pid:pts} }. Pure — never mutates t.
   */
  function progression(t) {
    if (t.config.fixedPairs) return teamProgression(t);
    const steps = [];
    for (let ri = 0; ri < t.rounds.length; ri++) {
      if (!anyScores(t.rounds[ri])) continue;
      // standings on the state as it stood after round ri (rounds are read-only here)
      const partial = { players: t.players, config: t.config, rounds: t.rounds.slice(0, ri + 1) };
      const st = standings(partial);
      const rank = {}, points = {};
      st.forEach((s, i) => { rank[s.player.id] = i; points[s.player.id] = s.points; });
      steps.push({ round: ri + 1, order: st.map(s => s.player.id), rank, points });
    }
    return steps;
  }

  /** progression() but keyed by team (fixed-pairs mode). */
  function teamProgression(t) {
    const steps = [];
    for (let ri = 0; ri < t.rounds.length; ri++) {
      if (!anyScores(t.rounds[ri])) continue;
      const partial = { players: t.players, teams: t.teams, config: t.config, rounds: t.rounds.slice(0, ri + 1) };
      const st = teamStandings(partial);
      const rank = {}, points = {};
      st.forEach((s, i) => { rank[s.team.id] = i; points[s.team.id] = s.points; });
      steps.push({ round: ri + 1, order: st.map(s => s.team.id), rank, points });
    }
    return steps;
  }

  /**
   * Opponent head-to-head records. Americano rotates partners, so "vs" means
   * being on the opposing team. Returns { [pid]: { [oid]: {faced, wins, losses,
   * draws, net} } } where net = Σ(myTeamScore − theirTeamScore) over shared
   * matches. net[a][b] === −net[b][a]; faced is symmetric. Pure.
   */
  function headToHead(t) {
    if (t.config.fixedPairs) return teamHeadToHead(t);
    const h2h = {};
    for (const p of t.players) h2h[p.id] = {};
    const bump = (a, b, mine, theirs) => {
      const rec = h2h[a][b] || (h2h[a][b] = { faced: 0, wins: 0, losses: 0, draws: 0, net: 0 });
      rec.faced++; rec.net += mine - theirs;
      if (mine > theirs) rec.wins++; else if (mine === theirs) rec.draws++; else rec.losses++;
    };
    for (const r of t.rounds) {
      for (const m of r.matches) {
        if (m.scoreA === null || m.scoreB === null) continue;
        for (const a of m.teamA) for (const b of m.teamB) {
          bump(a, b, m.scoreA, m.scoreB);
          bump(b, a, m.scoreB, m.scoreA);
        }
      }
    }
    return h2h;
  }

  /** headToHead() but team-vs-team (fixed-pairs mode). */
  function teamHeadToHead(t) {
    const teams = t.teams || [];
    const h2h = {};
    for (const tm of teams) h2h[tm.id] = {};
    const owner = {};
    for (const tm of teams) for (const pid of tm.players) owner[pid] = tm.id;
    const bump = (a, b, mine, theirs) => {
      const rec = h2h[a][b] || (h2h[a][b] = { faced: 0, wins: 0, losses: 0, draws: 0, net: 0 });
      rec.faced++; rec.net += mine - theirs;
      if (mine > theirs) rec.wins++; else if (mine === theirs) rec.draws++; else rec.losses++;
    };
    for (const r of t.rounds) {
      for (const m of r.matches) {
        if (m.scoreA === null || m.scoreB === null) continue;
        const A = owner[m.teamA[0]], B = owner[m.teamB[0]];
        if (A == null || B == null) continue;
        bump(A, B, m.scoreA, m.scoreB);
        bump(B, A, m.scoreB, m.scoreA);
      }
    }
    return h2h;
  }

  // ---------- roster changes ----------
  // every change that affects fairness or balance redraws the unplayed rounds

  /** Add a player mid-tournament. Returns the new player. Mixed mode needs a group. */
  function addPlayer(t, name, rng, skill, group) {
    name = String(name).trim();
    if (!name) throw new Error('Name required');
    const p = { id: uid(), name, active: true, skill: clampSkill(skill) };
    if (t.config.mixedGroups) {
      if (group !== 'A' && group !== 'B') throw new Error('Pick a group for the new player');
      p.group = group;
    }
    t.players.push(p);
    redrawFuture(t, rng);
    return p;
  }

  /** Add a fixed pair mid-tournament. `names` is [name1, name2]; future rounds redraw. */
  function addTeam(t, names, rng, skills) {
    if (!t.teams) throw new Error('Not a fixed-pairs tournament');
    const pair = (names || []).map(n => String(n).trim()).filter(Boolean);
    if (pair.length !== 2) throw new Error('A team needs two players');
    const tm = { id: tid(), players: [] };
    pair.forEach((name, i) => {
      const p = { id: uid(), name, active: true, arrived: true, skill: clampSkill(skills && skills[i]) };
      t.players.push(p);
      tm.players.push(p.id);
    });
    t.teams.push(tm);
    redrawFuture(t, rng);
    return tm;
  }

  /** Deactivate a fixed pair: kept in standings, excluded from future rounds. */
  function removeTeam(t, teamId, rng) {
    const tm = (t.teams || []).find(x => x.id === teamId);
    if (!tm) throw new Error('No such team');
    const isActive = activeTeams(t).some(x => x.id === teamId);
    if (isActive && activeTeams(t).length <= 2) throw new Error('Need at least 2 active teams');
    for (const pid of tm.players) { const p = t.players.find(x => x.id === pid); if (p) p.active = false; }
    redrawFuture(t, rng);
  }

  /** Bring a removed fixed pair back: rejoins from the next draw. */
  function reactivateTeam(t, teamId, rng) {
    const tm = (t.teams || []).find(x => x.id === teamId);
    if (!tm) throw new Error('No such team');
    for (const pid of tm.players) { const p = t.players.find(x => x.id === pid); if (p) p.active = true; }
    redrawFuture(t, rng);
  }

  function setSkill(t, pid, skill, rng) {
    const p = t.players.find(x => x.id === pid);
    if (!p) throw new Error('No such player');
    p.skill = clampSkill(skill);
    if (t.config.format === 'americano' && t.config.useSkills) redrawFuture(t, rng);
  }

  /** Deactivate a player: kept in standings, excluded from future rounds. */
  function removePlayer(t, pid, rng) {
    const p = t.players.find(x => x.id === pid);
    if (!p) throw new Error('No such player');
    if (p.active && activePlayers(t).length <= 4) {
      throw new Error('Need at least 4 active players');
    }
    if (p.active && t.config.mixedGroups && (p.group === 'A' || p.group === 'B')
      && activeByGroup(t)[p.group].length <= 2) {
      throw new Error('Need at least 2 active players per group');
    }
    p.active = false;
    redrawFuture(t, rng);
  }

  /** Bring a removed player back: rejoins from the next draw. */
  function reactivatePlayer(t, pid, rng) {
    const p = t.players.find(x => x.id === pid);
    if (!p) throw new Error('No such player');
    p.active = true;
    redrawFuture(t, rng);
  }

  /** Check a late-arriving player in: they join the draw from the next redraw. */
  function markArrived(t, pid, rng) {
    const p = t.players.find(x => x.id === pid);
    if (!p) throw new Error('No such player');
    p.arrived = true;
    p.active = true;
    redrawFuture(t, rng);
  }

  /** Drop a no-show who never checked in: hard-removed from the roster entirely. */
  function removeNoShow(t, pid, rng) {
    const i = t.players.findIndex(x => x.id === pid);
    if (i === -1) throw new Error('No such player');
    if (t.players[i].arrived !== false) throw new Error('Only un-arrived players can be removed as no-shows');
    t.players.splice(i, 1);
    redrawFuture(t, rng);
  }

  function renamePlayer(t, pid, name) {
    name = String(name).trim();
    if (!name) throw new Error('Name required');
    const p = t.players.find(x => x.id === pid);
    if (!p) throw new Error('No such player');
    if (t.players.some(x => x.id !== pid && x.name.toLowerCase() === name.toLowerCase())) {
      throw new Error('Name already in use');
    }
    p.name = name;
  }

  /** Change court count mid-tournament; unplayed rounds are redrawn. */
  function setCourts(t, n, rng) {
    n = Math.floor(Number(n));
    if (!(n >= 1 && n <= 6)) throw new Error('Courts must be 1-6');
    if (n === t.config.courts) return;
    t.config.courts = n;
    redrawFuture(t, rng);
  }

  /** Rename the two group labels (mixed mode). Display-only — no redraw. */
  function setGroupNames(t, names) {
    const a = String(names && names[0] || '').trim();
    const b = String(names && names[1] || '').trim();
    if (!a || !b) throw new Error('Both group names are required');
    t.config.groupNames = [a, b];
  }

  function playerName(t, pid) {
    const p = t.players.find(x => x.id === pid);
    return p ? p.name : '?';
  }

  return {
    createTournament, generateRound, regenerateRound, regenerateRoundRuled, redrawRules,
    refillPlanned, redrawFuture,
    setPlannedRounds, setScore, clearScore,
    roundComplete, standings, progression, headToHead, addPlayer, removePlayer, reactivatePlayer,
    markArrived, removeNoShow, pendingPlayers, PARTIAL_ROUND_CAP,
    renamePlayer, setCourts, setSkill, activePlayers,
    courtsUsed, historyCounts, playerName, anyScores,
    activeTeams, teamOf, teamLabel, teamHistory, teamStandings, teamProgression, teamHeadToHead,
    addTeam, removeTeam, reactivateTeam,
    activeByGroup, setGroupNames,
  };
})();
/*ENGINE-END*/

 * synchronous, so without this the tap gives no feedback until the new DOM lands.

function busy(btn, label, fn) {
  if (!btn || btn.dataset.busy) return;
  const orig = btn.innerHTML;
  btn.dataset.busy = '1';
  btn.classList.add('is-busy');
  btn.innerHTML = `<span class="spinner"></span>${label}`;
  setTimeout(() => {

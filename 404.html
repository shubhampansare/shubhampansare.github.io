<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - shoebum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%9F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..700,0..100,0..1;1,9..144,500..700,0..100,0..1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6EC;
  --card:#FFFFFF;
  --ink:#221A14;
  --accent:#FF5D46;
  --accent-2:#FFB525;
  --display:"Fraunces","Georgia",serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
.card{
  background:var(--card);border:2px solid var(--ink);border-radius:26px;
  box-shadow:8px 8px 0 var(--accent-2);padding:56px 40px;max-width:480px;
}
h1{
  font-family:var(--display);
  font-variation-settings:"opsz" 100,"SOFT" 50,"WONK" 1;
  font-weight:600;font-size:clamp(34px,7vw,52px);line-height:1.1;
}
h1 span{color:var(--accent)}
p{margin-top:14px;font-size:17px;color:#4b4038}
a.btn{
  margin-top:28px;display:inline-block;text-decoration:none;font-weight:700;
  background:var(--ink);color:var(--bg);border:2px solid var(--ink);
  border-radius:14px;padding:12px 24px;box-shadow:5px 5px 0 var(--accent);
  transition:transform .18s ease,box-shadow .18s ease;
}
a.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--accent)}
a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <h1><span>404.</span> This shoe never dropped.</h1>
  <p>Whatever lived here is gone or never existed.</p>
  <a class="btn" href="/">Back to shoebum.io</a>
</main>
</body>
</html>
